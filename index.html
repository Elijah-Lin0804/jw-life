  S._activeStudentId = null;
  S._pendingStudent = null;
  S.npc = null;
  syncStudentNameList();
}
function resumeStudent(st){
  const root = st.chain || (st.resumeId ? chainRoot(st.resumeId) : 'P001');
  const id = 'PX-2';
  st.alive = true;
  st.chain = root;
  st.next = id;
  st.plot = st.plot || pickStudentPlot();
  st.status = STUDENT_STATUS.study;
  st.endedAge = null;
  st.fails = st.fails || {};
  st.fails[id] = 0;
  return true;
}
function rollStoppedResumes(){
  const hit = [];
  const room = Math.max(0, preachChainCap() - activeStudents().length);
  stoppedStudents().forEach(st => {
    if (hit.length >= PREACH_RESUME_MAX_PER_YEAR) return;
    if (hit.length >= room) return;
    if (!chance(PREACH_RESUME_P)) return;
    if (resumeStudent(st)) hit.push(st);
  });
  return hit;
}
function runPreachQueue(queue, done){
  if (!queue.length){ S._activeStudentId = null; S._pendingStudent = null; done(); return; }
  const item = queue.shift();
  if (item.type === 'resume'){
    const st = studentById(item.id);
    if (!st){ runPreachQueue(queue, done); return; }
    pendingDiary('gold', '再開始討論', st.name + '前陣子停了下來，最近又願意約出來談談。', () => runPreachQueue(queue, done));
    return;
  }
  if (item.type === 'follow'){
    const st = studentById(item.id);
    if (!st || !st.alive || !st.next){ runPreachQueue(queue, done); return; }
    const ev = EVENTS.find(e => e.id === st.next);
    S._activeStudentId = st.id;
    S._pendingStudent = null;
    S._chainBurstLeft = PREACH_BURST_MAX;
    if (!ev){ runPreachQueue(queue, done); return; }
    playEvent(ev, () => runPreachQueue(queue, done));
    return;
  }
  if (S.chainsNewThisYear >= preachChainCap()){ runPreachQueue(queue, done); return; }
  if (!chance(item.p)){ runPreachQueue(queue, done); return; }
  const pool = EVENTS.filter(e => isPreachStart(e.id) && eventEligible(e));
  if (!pool.length){ runPreachQueue(queue, done); return; }
  const ev = weightedPick(pool);
  S._activeStudentId = null;
  S._pendingStudent = rollBibleStudent(ev);
  S._chainBurstLeft = PREACH_BURST_MAX;
  playEvent(ev, () => runPreachQueue(queue, done));
}
function runEventList(list, done){
  if (!list.length){ done(); return; }
  const ev = list.shift();
  playEvent(ev, () => runEventList(list, done));
}
function fillNpc(text, ev){
  const preach = ev && isPreachChainId(ev.id);
  const name = preach ? currentPreachName() : (S._npcRoll || '');
  /* {who} 只代表目前對象，不可沿用上一張卡留下的 _npcRoll（會變成「曾弟兄見家長」） */
  const who = (S.partner && S.partner.name) ? S.partner.name : '對方';
  let out = (text || '').replace(/\{npc\}/g, name).replace(/\{who\}/g, who);
  if (preach && isPreachStart(ev.id)){
    const st = S._pendingStudent || activeStudent();
    if (st) out += studentIntroExtra(st);
  }
  return out;
}
function studentIntroExtra(st){
  if (!st) return '';
  const kid = st.children > 0 ? ('有' + st.children + '個孩子') : '沒有孩子';
  return ' ' + studentPronoun(st) + '今年' + studentAgeNow(st) + '歲，' + (st.religion || '傳統信仰') + '背景，' + (st.married ? '已婚' : '未婚') + '、' + kid + '，工作是' + (st.job || '—') + '。個性' + (st.traits || []).join('、') + '。';
}
function playEvent(ev, after){
  ev = materializePreach(ev);
  S._npcRoll = null;
  if (ev.onStart) ev.onStart(S);
  noteDevEvent(ev.name);
  const title = '事件｜' + fillNpc(ev.name, ev);
  const body = fillNpc(ev.text, ev);
  const afterChain = () => {
    if (S._chainBurst && (S._chainBurstLeft || 0) > 0 && !S.done){
      const id = S._chainBurst;
      S._chainBurst = null;
      S._chainBurstLeft--;
      const nxt = EVENTS.find(e => e.id === id);
      if (nxt && eventEligible(nxt)){
        playEvent(nxt, after);
        return;
      }
    }
    after();
  };
  const finish = (res) => {
    const html = applyResult(ev, res);
    markFired(ev);
    if (S.health <= 0){ lastPageThenEnd('sick', html); return; }
    if (S.done) return;
    confirmContinue('結果｜' + ev.name, html, afterChain, {cls: S._lastTone || '', title: ev.name, html: '<p>' + body + '</p>' + html});
  };
  if (ev.instant){
    const html = '<p>' + body + '</p>' + applyResult(ev, ev.instant);
    markFired(ev);
    if (S.health <= 0){ lastPageThenEnd('sick', html); return; }
    if (S.done) return;
    confirmContinue(title, html, after, {cls: S._lastTone || '', title: ev.name, html});
    return;
  }
  ask(ev.name, body, ev.options.map(op => ({
    t: op.text,
    f: () => finish(rollResult(op.results))
  })));
}
function rollResult(results){
  let r = R() * 100;
  for (const x of results){
    r -= x.p;
    if (r <= 0) return x;
  }
  return results[results.length - 1];
}
function fxVal(v){
  if (v == null || v === '') return 0;
  if (Array.isArray(v)) return ri(Math.min(v[0], v[1]), Math.max(v[0], v[1]));
  return v;
}
function applyResult(ev, res){
  const fx = res.fx || {};
  const bits = [];
  let upN = 0, dnN = 0;
  const pairs = [['health','健康'],['money','存款'],['love','愛心'],['faith','信心'],['bible','聖經知識'],['skill','專業能力']];
  pairs.forEach(([k, lab]) => {
    if (fx[k] == null || fx[k] === '') return;
    let raw = fxVal(fx[k]);
    if (k === 'money' && Math.abs(raw) >= 8000) raw = Math.round(raw * 3);
    const useWit = false;
    const got = addStat(k, raw, useWit);
    const show = (k === 'money') ? raw : got;
    if (k !== 'money' && got === 0) return;
    if (show > 0) upN++;
    else if (show < 0) dnN++;
    const txt = k === 'money'
      ? (lab + ' ' + (raw >= 0 ? '+' : '') + fmtMoney(raw))
      : (lab + ' ' + (got > 0 ? '+' : '') + (Math.round(got * 10) / 10));
    const cls = show > 0 ? 'up' : (show < 0 ? 'dn' : '');
    bits.push(cls ? '<span class="' + cls + '">' + txt + '</span>' : txt);
  });
  S._lastTone = (upN && !dnN) ? 'good' : ((dnN && !upN) ? 'bad' : '');
  if (res.extra === 'addStudent'){
    const st = commitNewStudent(ev, res.follow || null);
    if (st){
      bits.push('聖經學生名單＋' + st.name + '（' + st.status + '）');
    }
  }
  if (res.extra === 'chainFail'){
    const st = activeStudent();
    if (st){
      st.fails = st.fails || {};
      const k = ev.id;
      st.fails[k] = (st.fails[k] || 0) + 1;
      const n = st.fails[k];
      if (n >= PREACH_FAIL_OUT){
        st.alive = false;
        st.resumeId = ev.id || st.next;
        st.next = null;
        st.status = STUDENT_STATUS.stop;
        st.endedAge = S.age;
        bits.push('第三次沒談攏，' + st.name + '停止學習／拒絕改變');
      } else {
        st.next = ev.id;
        st.followUnlock = st.followUnlock || {};
        st.followUnlock[ev.id] = true;
        bits.push('這次沒談成，還可以再試（已失敗 ' + n + '／' + PREACH_FAIL_OUT + ' 次）');
      }
    }
  }
  if (res.extra === 'dropStudent'){
    const st = activeStudent();
    if (st){
      st.alive = false;
      st.resumeId = ev.id || st.next;
      st.next = null;
      st.status = STUDENT_STATUS.stop;
      st.endedAge = S.age;
      bits.push(st.name + '停止學習／拒絕改變');
    }
  }
  if ((res.extra === 'breakup' || res.extra === 'divorce') && S.partner){
    const n = S.partner.name;
    const married = S.partner.stage === 'married' || res.extra === 'divorce';
    if (married){
      remTag('已婚'); remTag('交往中'); remTag('異信仰婚姻');
      remTag('分區監督的妻子'); remTag('代理分區監督');
      if (S.service && S.service.kind === 'co' && S.gender === '女') S.service = null;
      S.partner = null;
      addTag('離婚', '離婚');
      bits.push('與' + n + '離婚');
    } else {
      clearRelTags();
      S.partner = null;
      bits.push('與' + n + '分手');
    }
  }
  if (res.extra === 'baptize'){
    const st = activeStudent();
    if (st){
      S.baptisms = Math.min(50, S.baptisms + 1);
      st.alive = false;
      st.next = null;
      st.status = STUDENT_STATUS.bap;
      st.endedAge = S.age;
      bits.push(st.name + ' 受浸（幫助受浸人數 ' + S.baptisms + '）');
      milestone(st.name + ' 受浸');
    }
  }
  if (res.extra === 'loseJob'){
    S._jobLostThisYear = true;
    S.job = null;
    clearStatus('workStress');
    S._fullOtStreak = 0;
    bits.push('目前沒有工作');
  }
  if (res.extra === 'remoteMove'){
    S.job = null;
    if (S.lifeMode === 'enjoy' || S.lifeMode === 'comfort') S.lifeMode = 'simple';
    leaveCongregation();
    milestone('搬到較缺人的地區服務，並換會眾');
    bits.push('辭去原職、換到新會眾。聖經學生已交給其他人，名單清空。');
  }
  if (res.extra === 'tightenLife'){
    if (S.lifeMode === 'enjoy') S.lifeMode = 'comfort';
    else if (S.lifeMode === 'comfort') S.lifeMode = 'normal';
    else if (S.lifeMode === 'normal') S.lifeMode = 'simple';
    bits.push('生活開銷往下收一檔');
  }
  if (isPreachStart(ev.id) && res.extra !== 'addStudent'){
    S._pendingStudent = null;
  }
  if (res.follow){
    const st = activeStudent() || S._pendingStudent;
    if (st && st.alive){
      st.followUnlock = st.followUnlock || {};
      st.followUnlock[res.follow] = true;
      st.next = res.follow;
      applyStudentProgress(st, res.follow);
      if ((S._chainBurstLeft || 0) > 0 && chance(PREACH_BURST_P)){
        S._chainBurst = res.follow;
        bits.push(st.name + '進展很快，這回還可以再往下走一步');
      }
    }
  }
  const html = fillNpc(res.text, ev) + (bits.length ? '<div class="statline">' + bits.join('｜') + '</div>' : '');
  board();
  return html;
}
function markFired(ev){
  S.seen[ev.id] = (S.seen[ev.id] || 0) + 1;
  if (ev.cooldown) S.cool[ev.id] = ev.cooldown;
}

/* =========================================================
   10.2 年度流程：年度結算
   ========================================================= */
function settleThenAdvance(){
  if (S.done) return;
  const html = settleYear();
  closeDevTurn();
  if (S.health <= 0){ lastPageThenEnd('sick', html); return; }
  if (S.done) return;
  stepQ = [];
  /* 結算時若存款為負數，下一回合時間分配強制工作最大點數、極簡生活。 */
  S._debtForceNextYear = S.money < 0;
  if ((S.skipSport || 0) >= 2) stepQ.push(evNeglectSport);
  if ((S.skipFun || 0) >= 2) stepQ.push(evNeglectFun);
  if (has('正規先驅') && !isServiceAssign()) stepQ.push(evPioneerReview);
  stepQ.push(yearEndRolls);
  stepQ.push(lifeGate);
  stepQ.push(advanceAndContinue);
  confirmContinue('這一年的結算', html, nextStep, {cls:'', title:'這一年的日記', html});
}

function settleYear(){
  const tp = S.tpPlan || S.pendTp || {};
  const notes = [];
  const body = bodyTime(tp);
  const unused = body;

  const before = { health:S.health, love:S.love, faith:S.faith, bible:S.bible, skill:S.skill, money:S.money };
  addStat('health', bodyHealthDelta52(body)[0], false);

  if (isStudent() && tp.school != null){
    const t = tp.school || 0;
    const rate = S.uniType === '國立' ? 0.15 : 0.12;
    addStat('skill', t * rate, true);
    if (t >= 18) addStat('health', -1, false);
    if (t >= 22) addStat('health', -1, false);
  }

  if (S.job && S.job.kind === 'full'){
    const t = tp.jobF || 0;
    addStat('skill', t * (S.job.high ? 0.14 : 0.11), true);
    addStat('health', jobFullHealth52(t), false);
  }
  if (S.job && S.job.kind === 'part'){
    const t = tp.jobP || 0;
    addStat('skill', t * (S.job.high ? 0.12 : 0.08), true);
    if (t >= 13) addStat('health', -1, false);
  }
  if (tp.milA) addStat('health', -1, false);
  if (tp.milB) addStat('health', -2, false);

  const w = canWorship() ? (tp.worship || 0) : 0;
  if (canWorship()){
    if (w === 0){
      addStat('faith', -2, false);
    } else {
      const moodMul = has('情緒低落') ? 0.6 : 1;
      addStat('faith', w * 0.22 * moodMul, false);
      addStat('bible', w * 0.18 * moodMul, true);
      if (w >= 14) addStat('health', -1, false);
    }
  }

  const sp = tp.sport || 0;
  addStat('health', sportHealth52(sp), false);
  if (sp >= 3 && chance(8)){
    const up = 1; S.hpCap += up;
    notes.push('因為持續運動，健康上限提高了 ' + up + ' 點。');
  }

  const st = tp.study || 0;
  if (st){
    addStat('faith', st * 0.25, false);
    addStat('bible', st * 0.45, true);
    if (st >= 6) addStat('health', -1, false);
  }
  const gr = tp.grow || 0;
  if (gr){
    addStat('skill', gr * 0.28, true);
    if (gr >= 6) addStat('health', -1, false);
  }

  /* 專業能力退化：沒有全職／兼職工作，且精進自己少於 5 點時，連續每年加重 1 點。
     若本回合因失去工作事件而被迫沒有工作，則不算專業能力退化。最低維持 20。 */
  const hasWorkForSkill = !!(S.job && (S.job.kind === 'full' || S.job.kind === 'part'));
  if (!S._jobLostThisYear && !hasWorkForSkill && gr < 5){
    S.skillDecayYears = (S.skillDecayYears || 0) + 1;
    const decay = S.skillDecayYears;
    const beforeSkillDecay = S.skill;
    S.skill = Math.max(20, S.skill - decay);
    const actualDecay = beforeSkillDecay - S.skill;
    if (actualDecay > 0){
      notes.push('專業能力退化：本年度沒有從事全職或兼職工作，且「精進自己」未達 5 點，專業能力下降 ' + actualDecay + ' 點，目前為 ' + Math.round(S.skill) + '。');
    }
  } else {
    S.skillDecayYears = 0;
  }

  const fn = tp.fun || 0;
  if (fn){
    addStat('health', funHealth52(fn), false);
  }
  const spn = tp.sport || 0;
  S.skipSport = spn > 0 ? 0 : (S.skipSport || 0) + 1;
  S.skipFun = fn > 0 ? 0 : (S.skipFun || 0) + 1;

  /* 靈感：本回合聖經知識 / 專業能力的「已增加量」>0 才擲 */
  const dBible = S.bible - before.bible;
  const dSkill = S.skill - before.skill;
  const ib = insightRoll('bible', dBible);
  const is_ = insightRoll('skill', dSkill);
  if (ib) notes.push('這一年讀書特別順。');
  if (is_) notes.push('這一年做事特別上手。');

  /* ---- 金錢：先入帳再扣開銷 ---- */
  if (isStudent()){
    let pocket = S.wealth === '富裕' ? 200000 : S.wealth === '貧窮' ? 30000 : 80000;
    if (has('大學生')) pocket = Math.round(pocket * 0.7);
    S.money += pocket;
    notes.push('家庭零用錢 +' + fmtMoney(pocket));
  }
  if (isServiceAssign()){
    S.job = null;
    if (S.lifeMode === 'enjoy' || S.lifeMode === 'comfort') S.lifeMode = 'normal';
    const k = S.service.kind;
    let stip = 150000;
    if (k === 'bethel') stip = 70000;
    if (k === 'co') stip = 180000;
    S.money += stip;
    notes.push('服務津貼 +' + fmtMoney(stip));
  } else if (S.phase === 'MIL'){
    const milPay = S.milType === 'alt' ? 120000 : 80000;
    S.money += milPay;
    notes.push((S.milType === 'alt' ? '替代役津貼 +' : '役期津貼 +') + fmtMoney(milPay));
  } else if (yearPayJob()){
    const pay = jobIncomeSettle(tp);
    S.money += pay.base + pay.ot;
    notes.push('工作入帳 ' + fmtMoney(pay.base) + (pay.ot ? '（含加班 ' + fmtMoney(pay.ot) + '）' : '') + (S._quitThisYear ? '（按辭職前的工作結算）' : ''));
    if (S._loseJobAfterPay || S._losePartJobAfterPay){
      const lostPartJob = !!S._losePartJobAfterPay;
      S.job = null;
      S._loseJobAfterPay = false;
      S._losePartJobAfterPay = false;
      S.tpPlan = null;
      notes.push(lostPartJob ? '這份兼職工作沒了。' : '這份全職工作沒了。');
    }
  }
  if (S.partner && S.partner.stage === 'married'){
    const spIn = Math.round(spouseIncomeBase(S.partner) * SPOUSE_INCOME_MUL);
    if (spIn > 0){
      S.money += spIn;
      notes.push('配偶收入 +' + fmtMoney(spIn) + '（' + partnerJobLabel(S.partner) + '，入帳五成）');
    }
  }
  let live = 0, tuition = 0;
  const spendIdx = (fn * 1) + (sp * 0.6) + (gr * 0.5) + (w * 0.3);
  const tSpend = clamp(spendIdx / 18, 0, 1);
  if (isStudent()){
    const mode = LIFE_MODE.simple;
    live = Math.round((mode.lo + (mode.hi - mode.lo) * tSpend) * 0.5 * 10000);
  } else if (S.phase === 'MIL'){
    const mode = LIFE_MODE.simple;
    live = Math.round((mode.lo + (mode.hi - mode.lo) * tSpend) * 0.5 * 10000);
  } else if (showLifeModeUI() && S.lifeMode && LIFE_MODE[S.lifeMode]){
    const mode = LIFE_MODE[S.lifeMode];
    live = Math.round((mode.lo + (mode.hi - mode.lo) * tSpend) * 10) / 10;
    live = live * 10000;
    if (S.partner && S.partner.stage === 'married'){
      live = Math.round(live * MARRIED_LIVE_MUL);
    }
    if (isServiceAssign() && S.service.kind === 'bethel') live = Math.round(live * 0.35);
    if (!S.job && !isServiceAssign()){
      live = Math.round(live * 0.7);
      notes.push('目前沒有工作，生活費先按七成算。');
    }
    const hm = { simple:[-3,-2], normal:[-1,0], comfort:[1,2], enjoy:[3,4] }[S.lifeMode];
    if (hm && !(hm[0] === 0 && hm[1] === 0)) addStat('health', ri(hm[0], hm[1]), false);
  }
  if (has('大學生')) tuition = (S.uniType === '國立' ? 6 : 12) * 10000;
  const cost = live + tuition;
  if (cost){
    S.money -= cost;
    const feel = (() => {
      const spendIdx = (fn * 1) + (sp * 0.6) + (gr * 0.5) + (w * 0.3);
      if (spendIdx < 6) return '活動花費偏省';
      if (spendIdx <= 12) return '活動花費偏中';
      return '活動花費偏花';
    })();
    const marriedNote = (S.partner && S.partner.stage === 'married') ? '，已婚×' + MARRIED_LIVE_MUL : '';
    const modeNote = showLifeModeUI() && S.lifeMode
      ? '（' + LIFE_MODE[S.lifeMode].n + '生活' + marriedNote + '，' + feel + '）'
      : (S.phase === 'MIL' ? '（役期開銷）' : (isStudent() ? '（學生開銷）' : ''));
    notes.push('本年度生活開銷：' + fmtMoney(cost) + modeNote);
  }

  const famNeed = familyNeed52();
  const famGot = tp.family || 0;
  if (famNeed){
    if (famGot < famNeed){
      const gap = famNeed - famGot;
      addStat('health', gap <= 2 ? -1 : -2, false);
      addStat('love', gap <= 2 ? -1 : -2, false);
      notes.push('家裡顧得比較吃力。');
    }
    let kidCost = 0;
    (S.children || []).forEach(c => { kidCost += CHILD_YEAR_COST[childStageOf(c)] || 0; });
    if (kidCost){
      S.money -= kidCost;
      notes.push('子女開銷：' + fmtMoney(kidCost));
    }
  }

  if (!isStudent()){
    const sub = FAMILY_SUBSIDY[S.wealth] || FAMILY_SUBSIDY['普通'];
    if (sub && sub.p && chance(sub.p)){
      S.money -= sub.amt;
      notes.push('這年要補貼家用 ' + fmtMoney(sub.amt));
    }
  }
  if (S.money < 50000 && S.money >= 0){
    notes.push('手頭開始緊。');
  }
  if (S.money < 0){
    notes.push('這一年入不敷出，下回合時間分配將受限制。');
  }
  if (S.money <= -1000000){
    addStat('health', -3, false);
    notes.push('長期負債的壓力讓身體更差。');
  } else if (S.money <= -500000){
    addStat('health', -2, false);
    notes.push('負債的壓力讓身體較差。');
  } else if (S.money <= -200000){
    addStat('health', -1, false);
    notes.push('負債開始影響睡眠與身體。');
  }

  /* 冷卻倒數 */
  Object.keys(S.cool).forEach(k => { S.cool[k]--; if (S.cool[k] <= 0) delete S.cool[k]; });

  /* 一生時間分配（結局圓餅圖用 52 點計畫；舊存檔才退回結算強度） */
  S.tpLife = S.tpLife || {};
  const lifeSrc = S.tpPlan || tp;
  Object.keys(lifeSrc).forEach(k => {
    if (k === 'body') return;
    const v = lifeSrc[k] || 0;
    if (v) S.tpLife[k] = (S.tpLife[k] || 0) + v;
  });
  if (unused > 0) S.tpLife.body = (S.tpLife.body || 0) + unused;

  /* 崇拜紀錄 + 標籤 */
  S.worshipLog.push(w);
  if (S.worshipLog.length > 2) S.worshipLog.shift();
  updateFaithTags(w);

  const dH = S.health - before.health;
  const dM = S.money - before.money;
  const hpTxt = '健康 ' + (dH >= 0 ? '+' : '') + (Math.round(dH * 10) / 10) + ' → ' + shown(S.health);
  const mnTxt = '存款 ' + (dM >= 0 ? '+' : '') + fmtMoney(dM) + ' → ' + fmtMoney(S.money);
  const line = '<span style="color:' + toneColor(dH) + '">' + hpTxt + '</span>｜<span style="color:' + toneColor(dM) + '">' + mnTxt + '</span>';
  const html = notes.map(n => '<p>' + n + '</p>').join('') + '<div class="statline">' + line + '</div>';
  board();
  saveGame();
  return html;
}

function lastYearWorship(){

function updateFaithTags(wThis){
  if (has('停止傳道') && wThis >= 3) remTag('停止傳道');

function highPayChance(){
  if ((S.skill || 0) < 60) return 0;
  const s = S.skill / 100;
  const w = (S.wit - 80) / 40;
  let p = 0.08 + 0.42 * s + 0.12 * w + 0.08 * s * w;
  if (S.skill >= 80) p += 0.12;
  return clamp(p, 0, 0.72);
}
function yearPayJob(){
  return (S && (S._jobPay || S.job)) || null;
}
function jobSearchFailChance(){
  const age = Math.floor(S.age || 0);
  const skill = clamp(S.skill || 0, 0, 100);
  const p = 0.10 + (age - 30) * 0.006 - (skill - 50) * 0.0015;
  return clamp(p, 0.05, 0.50);
}
function takeJobOffer(kind, then){
  S._jobHuntCount = (S._jobHuntCount || 0) + 1;
  if (R() < jobSearchFailChance()){
    pendingDiary('info', '工作', '這次沒有找到合適的工作。', then);
    return;
  }
  const high = R() < highPayChance();
  S.job = { kind, high };
  S._jobPay = { kind, high };
  const lab = (high ? '高薪' : '一般') + (kind === 'full' ? '全職' : '兼職');
  milestone(lab);
  pendingDiary(high ? 'gold' : '', kind === 'full' ? '全職工作' : '兼職工作', '你找到一份' + lab + '工作。', then);
}
function findJobEvent(then){
  if (S.phase === 'MIL'){
    pendingDiary('info', '工作', '服役期間不能另外做全職或兼職。', then || showAlloc);
    return;
  }
  if (isServiceAssign()){
    pendingDiary('info', '工作', '全時服務期間不能另外做全職或兼職。', then || showAlloc);
    return;
  }
  const used = S._jobHuntCount || 0;
  if (used >= 3){
    pendingDiary('info', '找工作', '本回合已經找過 3 次工作，下一回合才能再次找工作。', then || showAlloc);
    return;
  }
  const p = highPayChance();
  const failPct = Math.round(jobSearchFailChance() * 100);
  const pct = Math.round(p * 100);
  const left = 3 - used;
  const onlyPart = S.phase === 'UNI' || (isStudent() && S.phase !== 'WORK');
  const opts = [];
  if (!onlyPart){
    opts.push({t:'找全職工作', s:'約 ' + failPct + '% 找不到；高薪約 ' + pct + '%', f:() => takeJobOffer('full', then)});
  }
  opts.push({t:'找兼職工作', s:'約 ' + failPct + '% 找不到；高薪約 ' + pct + '%', f:() => takeJobOffer('part', then)});
  opts.push({t:'先不找工作', f:() => {
    pendingDiary('info', '工作', '你決定先不找工作。需要時，可以再按「找工作」。', then);
  }});
  ask('找工作', onlyPart ? '大學期間只能找兼職。本回合還可以找 ' + left + ' 次。' : '目前沒有工作。本回合還可以找 ' + left + ' 次。', opts);
}
function advanceAndContinue(){
  if (S.done) return;
  const oldAge = Math.floor(S.age);
  S.age = oldAge + 1;

  /* 聖經學生的年齡由 studentAgeNow() 依「認識時年齡＋經過回合」計算，
     所以不另外累加，避免重複加 1；「對象」則直接保存目前年齡，因此要在這裡同步 +1。 */
  if (S.partner && S.partner.age != null){
    S.partner.age = Math.floor(S.partner.age) + 1;
  }

  S.turn++;
  if (S.age >= 65){ lastPageThenEnd('future'); return; }
  saveGame();
  beginYear();
}

function pieSvgText(text){

function pieLabelLayout(items, side, cy, top, bottom, minGap){
  const arr = items.filter(x => (side === 'right' ? x.cos >= 0 : x.cos < 0))
    .sort((a,b) => a.rawY - b.rawY);
  const ys = arr.map(x => clamp(x.rawY, top, bottom));
  for (let i = 1; i < ys.length; i++) ys[i] = Math.max(ys[i], ys[i-1] + minGap);
  if (ys.length && ys[ys.length-1] > bottom){
    ys[ys.length-1] = bottom;
    for (let i = ys.length - 2; i >= 0; i--) ys[i] = Math.min(ys[i], ys[i+1] - minGap);
  }
  return arr.map((x,i) => Object.assign({}, x, {labelY:ys[i]}));
}
function paintTpPieHtml(){
  if (!S || !S.tpLife) return '<p class="end-empty">沒有留下時間分配的紀錄。</p>';
  const merged = {};
  Object.keys(S.tpLife).forEach(k => {
    const key = TP_LIFE_MERGE[k] || k;
    merged[key] = (merged[key] || 0) + (S.tpLife[k] || 0);
  });
  const items = Object.keys(TP_LIFE_LABEL).map(k => ({
    k:k, lab:TP_LIFE_LABEL[k], v:merged[k] || 0, c:TP_LIFE_COLOR[k] || '#7a7368'
  })).filter(x => x.v > 0);
  const sum = items.reduce((a,x) => a + x.v, 0);
  if (!sum) return '<p class="end-empty">沒有留下時間分配的紀錄。</p>';

  const cx = 210, cy = 150, r = 88;
  let angle = -Math.PI / 2;
  const slices = items.map(x => {
    const a0 = angle;
    const delta = x.v / sum * Math.PI * 2;
    angle += delta;
    const a1 = angle;
    const mid = a0 + delta / 2;
    return Object.assign({}, x, {
      a0:a0, a1:a1, mid:mid,
      cos:Math.cos(mid), sin:Math.sin(mid),
      rawY:cy + Math.sin(mid) * (r + 24)
    });
  });
  const arc = (x) => {
    const x0 = cx + Math.cos(x.a0) * r, y0 = cy + Math.sin(x.a0) * r;
    const x1 = cx + Math.cos(x.a1) * r, y1 = cy + Math.sin(x.a1) * r;
    const large = (x.a1 - x.a0) > Math.PI ? 1 : 0;
    return 'M ' + cx + ' ' + cy + ' L ' + x0.toFixed(2) + ' ' + y0.toFixed(2) +
      ' A ' + r + ' ' + r + ' 0 ' + large + ' 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2) + ' Z';
  };
  const left = pieLabelLayout(slices,'left',cy,28,272,30);
  const right = pieLabelLayout(slices,'right',cy,28,272,30);
  const positioned = left.concat(right);
  const lines = positioned.map(x => {
    const sx = cx + x.cos * r;
    const sy = cy + x.sin * r;
    const elbowX = x.cos >= 0 ? 312 : 108;
    const tx = x.cos >= 0 ? 324 : 96;
    const anchor = x.cos >= 0 ? 'start' : 'end';
    const pct = Math.round(x.v / sum * 1000) / 10;
    return '<g class="end-pie-label">' +
      '<path d="M ' + sx.toFixed(1) + ' ' + sy.toFixed(1) + ' L ' + elbowX + ' ' + x.labelY.toFixed(1) + ' L ' + tx + ' ' + x.labelY.toFixed(1) + '" fill="none" stroke="' + x.c + '" stroke-width="1.2" />' +
      '<circle cx="' + sx.toFixed(1) + '" cy="' + sy.toFixed(1) + '" r="2" fill="' + x.c + '" />' +
      '<text x="' + tx + '" y="' + (x.labelY - 2).toFixed(1) + '" text-anchor="' + anchor + '" class="end-pie-label-name">' + pieSvgText(x.lab) + '</text>' +
      '<text x="' + tx + '" y="' + (x.labelY + 14).toFixed(1) + '" text-anchor="' + anchor + '" class="end-pie-label-pct">' + pct + '%</text>' +
      '</g>';
  }).join('');
  const paths = slices.map(x => '<path d="' + arc(x) + '" fill="' + x.c + '" stroke="var(--paper2)" stroke-width="1.5" />').join('');
  const svg = '<svg class="end-pie-svg" viewBox="0 0 420 300" role="img" aria-label="一生時間分配圓餅圖">' +
    paths + lines + '</svg>';
  return '<div class="end-time"><div class="end-pie-wrap">' + svg + '</div></div>';
}

    npc: activeStudents().map(st => st.name + '·' + st.status + (st.next ? '→' + st.next : '')).join('、') || '—'
  };

function startDevTurn(){
  if (!S) return;
  S._devSnap = snapDev();
  S._devDelta = {health:0, money:0, love:0, faith:0, bible:0, skill:0};
  S._devEvents = [];
}
function noteDevDelta(key, got){
  if (!S || !S._devDelta) return;
  if (S._devDelta[key] == null) S._devDelta[key] = 0;
  S._devDelta[key] += got;
  if (DEV) renderDev();
}
function noteDevEvent(name){
  if (!S) return;
  S._devEvents = S._devEvents || [];
  S._devEvents.push(name);
  if (DEV) renderDev();
}
function closeDevTurn(){
  if (!S) return;
  const before = S._devSnap || {};
  const after = snapDev() || {};
  const lines = [];
  ['health','money','love','faith','bible','skill'].forEach(k => {
    const d = (S._devDelta && S._devDelta[k]) || 0;
    const a = after[k];
    const b = before[k];
    if (d || (a != null && b != null && a !== b)){
      const shownD = k === 'money' ? ((d>=0?'+':'') + fmtMoney(d)) : ((d>=0?'+':'') + (Math.round(d*10)/10));
      const shownA = k === 'money' ? fmtMoney(a) : shown(a);
      lines.push(DEV_LABELS[k] + ' ' + shownD + ' → ' + shownA);
    }
  });
  const evs = (S._devEvents || []).slice();
  const tag0 = before.tags || [];
  const tag1 = after.tags || [];
  const tagAdd = tag1.filter(t => tag0.indexOf(t) < 0);
  const tagDel = tag0.filter(t => tag1.indexOf(t) < 0);
  S._devLast = {
    label: ageLabel(),
    lines: lines,
    events: evs,
    tagAdd: tagAdd,
    tagDel: tagDel
  };
  renderDev();
}
function fmtDevVal(k, v){
  if (v == null) return '—';
  if (k === 'money') return fmtMoney(v);
  if (typeof v === 'number') return shown(v);
  return String(v);
}
function renderDev(){
  const box = $('dev-now');
  const last = $('dev-last');
  if (!box || !last) return;
  if (!DEV || !isDesk()){ box.innerHTML = ''; last.innerHTML = ''; return; }
  if (!S){
    box.innerHTML = '<p style="color:var(--faint)">尚未開局</p>';
    last.innerHTML = '';
    return;
  }
  const cur = snapDev();
  let h = '<div class="dev-grid">';
  ['wit','love','faith','bible','skill','health'].forEach(k => {
    h += '<div class="dev-row"><span>' + DEV_LABELS[k] + '</span><b>' + fmtDevVal(k, cur[k]) + (k==='health' ? ' / ' + S.hpCap : '') + '</b></div>';
  });
  h += '<div class="dev-row"><span>存款</span><b>' + fmtDevVal('money', cur.money) + '</b></div>';
  h += '<div class="dev-row"><span>幫助受浸</span><b>' + (S.baptisms || 0) + '</b></div>';
  h += '</div>';
  h += '<div>工作 ' + cur.job + '　生活 ' + (LIFE_MODE[S.lifeMode] ? LIFE_MODE[S.lifeMode].n : cur.life) + '</div>';
  h += '<div>學生 ' + (allBibleStudents().map(st => st.name + '（' + st.status + '）').join('、') || '無') + '</div>';
  h += '<div>跟進 ' + cur.npc + '</div>';
  h += '<div>本年新鏈 ' + (S.chainsNewThisYear || 0) + '／上限 ' + preachChainCap() + '</div>';
  h += '<div class="dev-sec">隱藏</div>';
  h += '<div>階段 ' + S.phase + '　回合 ' + S.turn + '　種子 ' + SEED + '</div>';
  h += '<div>跳過運動 ' + (S.skipSport || 0) + '　跳過休閒 ' + (S.skipFun || 0) + '</div>';
  h += '<div>健康原始 ' + S.health + '　上限 ' + S.hpCap + '　悟性 ' + S.wit + '</div>';
  h += '<div>崇拜紀錄 [' + (S.worshipLog || []).join(',') + ']　先驅違規 ' + (S.pioBadStreak || 0) + '</div>';
  if (S.service) h += '<div>委派 ' + (S.service.title || S.service.kind) + (S.service.until ? '　至' + S.service.until + '歲' : '') + '</div>';
  if (S.partner) h += '<div>對象 ' + S.partner.name + '　先驅 ' + (S.partner.pioneer ? '是' : '否') + (S.partner.serviceWith ? '　' + S.partner.serviceWith : '') + '</div>';
  h += '<div>標籤年資　' + tagList().map(t => t + tagYears(t).toFixed(1)).join('、') + '</div>';
  if (S.ske) h += '<div>SKE 已申請 ' + (S.ske.applyCount || 0) + ' 次</div>';
  if (S._devDelta){
    const live = ['health','money','love','faith','bible','skill'].filter(k => S._devDelta[k]).map(k => {
      const d = S._devDelta[k];
      const t = k==='money' ? ((d>=0?'+':'')+fmtMoney(d)) : ((d>=0?'+':'')+(Math.round(d*10)/10));
      return DEV_LABELS[k] + ' ' + t;
    });
    if (live.length) h += '<div class="dev-sec">本回累計　' + live.join('　') + '</div>';
  }
  if ((S._devEvents||[]).length) h += '<div>已出事件　' + S._devEvents.join('、') + '</div>';
  box.innerHTML = h;
  const L = S._devLast;
  if (!L){ last.innerHTML = '<div class="dev-kicker">上一回</div><p style="color:var(--faint)">這一回結束後會出現彙整。</p>'; return; }
  let x = '<div class="dev-kicker">剛結束的回合　' + L.label + '</div>';
  if (L.lines && L.lines.length) x += '<ul class="dev-log">' + L.lines.map(t => '<li>' + t + '</li>').join('') + '</ul>';
  else x += '<p>數值沒有淨變化。</p>';
  if (L.events && L.events.length) x += '<p>事件：' + L.events.join('、') + '</p>';
  if (L.tagAdd && L.tagAdd.length) x += '<p>新身分：' + L.tagAdd.join('、') + '</p>';
  if (L.tagDel && L.tagDel.length) x += '<p>失去：' + L.tagDel.join('、') + '</p>';
  last.innerHTML = x;
}

function setAllocTools(onAfter){
  const items = [];
  if (S.job && !isServiceAssign() && S.phase !== 'MIL') items.push({id:'quit', label:'辭去工作', cls:'tool'});
  if (has('正規先驅') && !isServiceAssign()) items.push({id:'pio-off', label:'停止正規先驅', cls:'tool'});
  const fill = (box, prefix) => {
    if (!box) return;
    box.innerHTML = '';
    items.forEach(it => {
      const b = document.createElement('button');
      b.className = 'btn ' + it.cls;
      b.id = prefix + it.id;
      b.textContent = it.label;
      box.appendChild(b);
    });
  };
  if ($('tools-mob')) $('tools-mob').innerHTML = '';
  if ($('tools-desk')) $('tools-desk').innerHTML = '';
  const side = $('alloc-soft');
  if (side){
    side.className = 'alloc-soft' + (items.length >= 2 ? ' two' : '');
    fill(side, 's-');
  } else {
    fill($('tools-mob'), 'm-');
    fill($('tools-desk'), 'd-');
  }
  const bind = (id, fn) => {
    const a = $('m-' + id), b = $('d-' + id), c = $('s-' + id);
    if (a) a.onclick = fn;
    if (b) b.onclick = fn;
    if (c) c.onclick = fn;
  };
  bind('pio-off', () => {
    const finish = (msg) => {
      S.tpPlan = null;
      pendingDiary('info', '正規先驅', msg, () => {
        board();
        if (onAfter) onAfter();
      });
    };
    if (spouseIsPioneer()){
      ask('停止正規先驅', '你們兩人都是正規先驅。要停哪一方？', [
        {t:'只停你自己', f:() => { remTag('正規先驅'); finish('你停止了正規先驅。' + S.partner.name + '仍是正規先驅。'); }},
        {t:'只停' + S.partner.name, f:() => { S.partner.pioneer = false; finish(S.partner.name + '停止了正規先驅。你仍是正規先驅。'); }},
        {t:'雙方都停', f:() => { remTag('正規先驅'); S.partner.pioneer = false; finish('你們都停止了正規先驅。'); }},
        {t:'取消', f:() => { if (onAfter) onAfter(); }}
      ]);
      return;
    }
    remTag('正規先驅');
    finish('你停止了正規先驅服務。崇拜的必要時間少了。');
  });
  bind('quit', () => {
    ask('辭掉工作', '確定要辭掉目前的工作嗎？辭職後，本回合不再有工作時間可分配。', [
      {t:'確定辭職', warn:true, f:() => {

        S.job = null;
        clearStatus('workStress');
        S._fullOtStreak = 0;
        S.tpPlan = null;
        milestone('辭去工作');
        board();
        pendingDiary('info', '辭職', '你辭去了工作。本回合已沒有工作，可按「找工作」重新尋找工作。', () => {
          S.tpPlan = null;
          showAlloc();
        });
      }},
      {t:'取消', f:() => { if (onAfter) onAfter(); }}
    ]);
  });
  bind('job', () => findJobEvent(() => { S.tpPlan = null; showAlloc(); }));
}
function ask(name, body, opts){

function choose(title, opts){

    const b = document.createElement('button');

    b.className = 'btn' + (o.warn ? ' warn' : '');
    b.innerHTML = o.t + (o.s ? '<small>' + o.s + '</small>' : '');

function confirmContinue(title, html, then, diary){

  };

}

const DESK_KEY = 'jwlife-desk';
const THEME_KEY = 'jwlife-theme';
const THEMES = {
  light: { n:'淺色紙本', color:'#ebe4d4' },
  dark: { n:'墨水深夜', color:'#0c0e14' },
  ink: { n:'窗邊信紙', color:'#e3e9e0' },
  parchment: { n:'燈下羊皮', color:'#211a12' }
};
function isDesk(){ return document.body.classList.contains('desk'); }
function isActMin(){ return document.body.classList.contains('act-min'); }
function setActMin(on){
  if (isDesk()) on = false;
  document.body.classList.toggle('act-min', !!on);
  const b = $('act-fold');
  if (b) b.textContent = on ? '展開操作欄 ▴' : '收合操作欄 ▾';
}
function applyDesk(on){
  document.body.classList.toggle('desk', !!on);
  try{ localStorage.setItem(DESK_KEY, on ? '1' : '0'); }catch(e){}
  if (on) setActMin(false);
  applyDev();
  syncStartChoices();
}
function currentTheme(){
  const t = document.documentElement.getAttribute('data-theme');
  return THEMES[t] ? t : 'light';
}
function applyTheme(name){
  const key = THEMES[name] ? name : 'light';
  document.documentElement.setAttribute('data-theme', key);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', THEMES[key].color);
  try{ localStorage.setItem(THEME_KEY, key); }catch(e){}
  syncStartChoices();
}
function syncStartChoices(){
  document.querySelectorAll('#start-desk .btn').forEach(b => {
    b.classList.toggle('main', String(+isDesk()) === b.dataset.desk);
  });
  document.querySelectorAll('#start-theme .btn, #m-themes .btn').forEach(b => {
    b.classList.toggle('main', currentTheme() === b.dataset.theme);
  });
}
(function initPrefs(){
  let on = null;
  try{ const v = localStorage.getItem(DESK_KEY); if (v === '1') on = true; if (v === '0') on = false; }catch(e){}
  if (on === null) on = window.matchMedia('(min-width:900px)').matches;
  applyDesk(on);
  let theme = 'light';
  try{ const th = localStorage.getItem(THEME_KEY); if (THEMES[th]) theme = th; }catch(e){}
  applyTheme(theme);
  applyDev();
})();

})();

/* =========================================================
   14. 遊戲啟動
   ========================================================= */
function newSeed(){ return Math.random().toString(36).slice(2, 10); }
function showStartSeed(){
  const box = $('in-seed');
  if (box) box.value = SEED;
}
(function initStart(){
  const q = new URLSearchParams(location.search).get('seed');
  SEED = q || newSeed();
  showStartSeed();
  if (localStorage.getItem(SAVE_KEY)) $('btn-load').style.display = '';
  document.querySelectorAll('#start-desk .btn').forEach(b => {
    b.onclick = () => applyDesk(b.dataset.desk === '1');
  });
  document.querySelectorAll('#start-theme .btn').forEach(b => {
    b.onclick = () => applyTheme(b.dataset.theme);
  });
  const reroll = $('btn-reroll-seed');
  if (reroll) reroll.onclick = () => {
    SEED = newSeed();
    showStartSeed();
  };
  syncStartChoices();
})();

document.querySelectorAll('.start-ver').forEach(n => {
  n.addEventListener('click', tapHiddenDev);
});
if ($('bd-age')) $('bd-age').addEventListener('click', tapHiddenDev);

$('btn-new').onclick = () => {
  const typed = $('in-seed').value.trim();
  if (typed) SEED = typed;
  history.replaceState(null, '', '?seed=' + encodeURIComponent(SEED));
  seedInit(SEED);
  /* 0.1% 夭折：在童年之前，1000 < 1 */
  if (R() * 1000 < 1){
    S = null;
    endGame('infant');
    $('start').style.display = 'none';
    return;
  }
  const ch = rollChildhood();
  const pages = (ch.lines && ch.lines.length ? ch.lines : [ch.story]).map(l => '<p>' + l + '</p>').join('');
  $('start').innerHTML = '<div class="kicker">CHILDHOOD</div>' +
    '<h1 class="brand-mark">JW-Life</h1>' +
    '<p class="lead" style="margin:0 0 8px">還記得的那些事</p>' +
    '<div class="note">' + pages + '</div>' +
    '<div class="field"><label>你的名字</label><input id="in-name" maxlength="10" placeholder="寫在日記封面"></div>' +
    '<button class="btn main" id="btn-go">從十九歲這一年寫起 ▸</button>';
  $('btn-go').onclick = () => {
    const nm = ($('in-name').value || '').trim() || '無名氏';
    S = newState(nm, ch);
    $('start').style.display = 'none';
    $('app').classList.add('on');
    document.body.classList.add('playing');
    card('gold', '日記的第一頁', '你逐漸長大，有越來越多選擇要自己做，請好好善用一生寶貴的時光，創造出只屬於你的人生軌跡。');
    beginYear();
  };
};

$('btn-load').onclick = () => {
  if (!loadGame()){ alert('沒有可用的存檔'); return; }
  $('start').style.display = 'none';
  $('app').classList.add('on');
  document.body.classList.add('playing');
  $('ending').style.display = 'none';
  if (S.done){ revealEnding(S.endId || 'future'); return; }
  divider();
  card('info', '讀取日記', '從 ' + ageLabel() + ' 繼續。種子 ' + SEED + '。');
  board();
  /* 讀檔後停在操作區，讓玩家再分配或看選單，不重跑本回合事件 */
  showAlloc();
};

function buildPreviewState(id, trait){
  seedInit(SEED || 'preview34');
  const loveFirst = trait !== 'faith';
  const ch = {
    gender:'女', mood:'和諧', wealth:'普通', parent:'見證人', parentKind:'見證人1',
    wit:108,
    love: loveFirst ? 86 : 61,
    faith: loveFirst ? 64 : 88,
    bible: 72, skill: 58, health: 74,
    story:'', lines:[]
  };
  S = newState('林詩涵', ch);
  S.age = (id === 'future') ? 65 : (id === 'sick' ? 41 : 38);
  S.turn = 50;
  S.health = id === 'sick' ? 0 : 68;
  S.hpCap = 94;
  S.money = 1280000;
  S.baptisms = 3;
  S.tags = {
    '第二代': { since: 0, atAge: 16 },
    '傳道員': { since: 8, atAge: 19 },
    '堪作榜樣': { since: 12, atAge: 21 }
  };
  S.partner = { name:'陳志明', gender:'男', jw:true, stage:'married', since: 16, sinceAge: 24 };
  S.children = [{ nick:'小禾', gender:'女', bornAge: 28 }];
  S.everMarried = true;
  S.everPartner = true;
  S.milestones = [
    { age:16, half:0, text:'日記的第一頁' },
    { age:18, half:0, text:'受浸，成為傳道員' },
    { age:24, half:0, text:'與陳志明結婚' },
    { age:28, half:0, text:'小禾出生' },
    { age:36, half:0, text:'幫助第三人受浸' }
  ];
  S.done = true;
  S.endId = id;
  S._preview = true;
}

(function bootEndPreview(){
  const q = new URLSearchParams(location.search);
  const id = q.get('endPreview');
  if (!id) return;
  const allowed = { future:1, sick:1, accident:1, tribulation:1, infant:1 };
  if (!allowed[id]) return;
  if (q.get('seed')) SEED = q.get('seed');
  else if (!SEED) SEED = newSeed();
  const start = $('start');
  if (start) start.style.display = 'none';
  if (id === 'infant'){
    S = null;
    revealEnding('infant');
    return;
  }
  buildPreviewState(id, q.get('trait'));
  const w = endingWords(id);
  revealEnding(id, w.html);
})();
</script>
