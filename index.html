<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ebe4d4" id="meta-theme">
<title>JW-Life v5.3.55</title>
<meta name="description" content="從十九歲開始，每年分配一次時間。信仰、學業、工作與健康，都要自己選。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
/* 筆記本風格：米色紙、左側紅線、沉穩墨色。變數集中，之後要換色只改這裡。 */
:root{
  --paper:#f7f1e4;
  --paper2:#efe7d6;
  --ink:#2b2823;
  --faint:#7a7368;
  --rule:#d7cbb3;
  --margin:#c45c4a;
  --band:#3f5348;
  --good:#2f6b3a;
  --bad:#9a3b32;
  --gold:#8a6a22;
  --btn:#3f5348;
  --shadow:rgba(60,50,30,.12);
  --card:#fffdf8;
  --input:#fffdf8;
  --page-bg:#cfc4ad;
  --page-glow:rgba(255,255,255,.35);
  --life-track:#e5dcc8;
  --seg-on:#eef3ef;
  --warn-bg:#f8ece9;
  --tag-bad-bd:#e2b2ac;
  --tag-good-bd:#c5d7c8;
  --pio:#6d5a28;
  --job:#2f4f55;
  --ctrl:#fffdf8;
  --ctrl-bd:#d7cbb3;
  --r:8px;
  --serif:'Noto Serif TC',serif;
  --sans:'Noto Sans TC',-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  --title-weight:900;
}
html[data-theme="dark"]{
  --paper:#12141a; --paper2:#0c0e14; --ink:#d7dde8; --faint:#8b93a3; --rule:#2a3140; --margin:#6e8b9c;
  --band:#7aa0a8; --good:#7fbf9a; --bad:#d98989; --gold:#c4b48a; --btn:#3d4f5c; --shadow:rgba(0,0,0,.5);
  --card:#1a1e28; --input:#0e1118; --page-bg:#07080c; --page-glow:rgba(122,160,168,.08);
  --life-track:#1c2230; --seg-on:#1b2a30; --warn-bg:#3a2226; --tag-bad-bd:#6a3d42; --tag-good-bd:#2f5a44;
  --pio:#8a7340; --job:#3d6a72; --ctrl:#2c3344; --ctrl-bd:#6a7386;
  --serif:'Noto Sans TC',-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  --sans:'Noto Sans TC',-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  --title-weight:700;
}
html[data-theme="ink"]{
  --paper:#eef2ec; --paper2:#e3e9e0; --ink:#243028; --faint:#66736b; --rule:#c5d0c6; --margin:#4e7a68;
  --band:#3d6a58; --good:#2f6b3a; --bad:#9a3b32; --gold:#6d6a22; --btn:#3d6a58; --shadow:rgba(40,55,45,.12);
  --card:#f7faf6; --input:#f7faf6; --page-bg:#c5d0c6; --page-glow:rgba(255,255,255,.4);
  --life-track:#d7e0d6; --seg-on:#e6eee8; --warn-bg:#f3e8e5; --tag-bad-bd:#e2b2ac; --tag-good-bd:#c5d7c8;
  --pio:#6d5a28; --job:#2f4f55; --ctrl:#f7faf6; --ctrl-bd:#c5d0c6;
  --serif:'ZCOOL XiaoWei','Noto Serif TC',serif;
  --sans:'Noto Serif TC','Noto Sans TC',serif;
  --title-weight:400;
}
html[data-theme="parchment"]{
  --paper:#2a2218; --paper2:#211a12; --ink:#f0e2c4; --faint:#b9a682; --rule:#4a3b28; --margin:#c4844a;
  --band:#d4a24a; --good:#b7c47a; --bad:#e09a7a; --gold:#e6c36a; --btn:#6a4e2c; --shadow:rgba(0,0,0,.45);
  --card:#32281c; --input:#1a140e; --page-bg:#140f0a; --page-glow:rgba(230,195,106,.1);
  --life-track:#3a2e1e; --seg-on:#3d2f1c; --warn-bg:#4a2a20; --tag-bad-bd:#8a5340; --tag-good-bd:#5a6238;
  --pio:#8a7340; --job:#3d6a72; --ctrl:#4a3b28; --ctrl-bd:#b9a682;
  --serif:'Noto Serif TC',serif;
  --sans:'Noto Serif TC','Noto Sans TC',serif;
  --title-weight:900;
}
#start{position:relative}
.brand{margin:4px 0 18px;padding-bottom:10px;border-bottom:1px solid var(--rule)}
.brand-mark{
  display:block;font-family:var(--serif);font-weight:900;font-size:42px;
  letter-spacing:.08em;line-height:1.1;color:var(--ink);
}
.brand-mark::after{
  content:"從十九歲寫起";display:block;margin-top:8px;
  font-size:12px;font-weight:500;letter-spacing:.28em;color:var(--faint);
}
html[data-theme="dark"] .brand-mark{color:var(--gold);letter-spacing:.16em;text-shadow:0 0 18px rgba(201,168,76,.18)}
html[data-theme="dark"] .brand-mark::after{content:"燈下翻開這一頁";letter-spacing:.32em}
html[data-theme="ink"] .brand-mark{font-weight:700;letter-spacing:.14em;font-style:italic;color:var(--band)}
html[data-theme="ink"] .brand-mark::after{content:"窗邊的一封信";font-style:normal}
html[data-theme="parchment"] .brand-mark{letter-spacing:.22em;color:var(--gold)}
html[data-theme="parchment"] .brand-mark::after{content:"舊紙上的名字"}
.note{
  font-family:var(--serif);font-size:18px;line-height:32px;color:var(--ink);
  margin:8px 0 18px;padding:4px 2px 8px;
  background-image:repeating-linear-gradient(transparent 0 31px, var(--rule) 31px 32px);
}
.note p{
  margin:0;min-height:32px;padding:0 4px;
}
#start.sheet{
  background-image:repeating-linear-gradient(transparent 0 31px, rgba(0,0,0,.04) 31px 32px);
  background-attachment:local;
}
html[data-theme="dark"] #start.sheet,html[data-theme="parchment"] #start.sheet{
  background-image:repeating-linear-gradient(transparent 0 31px, rgba(255,255,255,.05) 31px 32px);
}

.start-ver{position:absolute;top:10px;right:14px;font-size:10px;letter-spacing:.14em;color:var(--faint);opacity:.42;font-family:var(--sans);cursor:default;user-select:none}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;height:100dvh;overscroll-behavior-y:none}
@supports (height: 100svh){ html,body{height:100svh} }
body{
  background:
    radial-gradient(ellipse at top, var(--page-glow), transparent 55%),
    var(--page-bg);
  color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;
}
body.playing{overflow:hidden}
#app,#start,#ending{min-height:100vh;min-height:100dvh}
a{color:var(--band)}

.sheet{
  max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;
  background:var(--paper);
  border-left:3px solid var(--margin);
  box-shadow:0 0 0 1px var(--rule), 0 18px 40px var(--shadow);
  padding:28px 22px 48px calc(22px + 8px);
  padding-top:calc(28px + env(safe-area-inset-top,0px));
}
.kicker{font-family:var(--serif);letter-spacing:.28em;font-size:11px;color:var(--faint);text-transform:uppercase}
h1{font-family:var(--serif);font-weight:var(--title-weight);font-size:34px;letter-spacing:.06em;margin:10px 0 8px;line-height:1.25}
.lead{color:var(--faint);font-size:16px;margin-bottom:14px;line-height:1.7}
.field{margin-top:16px}
.field label{display:block;font-size:12px;letter-spacing:.18em;color:var(--faint);font-weight:700;margin-bottom:6px}
.field input,.field select{
  width:100%;background:var(--input);border:1px solid var(--rule);border-radius:var(--r);
  color:var(--ink);font-family:var(--sans);font-size:16px;padding:10px 12px;outline:none;
}
.field input:focus{border-color:var(--band)}
.seedline{font-size:12px;color:var(--faint);margin-top:16px}
.seedline b{color:var(--gold)}
.seedbar{margin-top:20px}
.seedbar .seed-lab{font-size:12px;letter-spacing:.18em;color:var(--faint);font-weight:700;margin-bottom:6px}
.seedbar .seed-row{display:flex;gap:8px;align-items:stretch}
.seedbar .seed-row input{
  flex:1;min-width:0;background:var(--input);border:1px solid var(--rule);border-radius:var(--r);
  color:var(--ink);font-family:var(--sans);font-size:16px;padding:10px 12px;outline:none;
}
.seedbar .seed-row input:focus{border-color:var(--band)}
.seedbar .btn-seed{width:auto;flex:0 0 auto;margin-top:0;white-space:nowrap;padding:10px 12px;font-size:14px}
.seedbar .seed-help{font-size:12px;color:var(--faint);margin-top:8px;line-height:1.55}
.btn{
  display:block;width:100%;background:var(--card);border:1px solid var(--rule);color:var(--ink);
  font-family:var(--sans);font-size:15px;font-weight:700;border-radius:var(--r);
  padding:11px 14px;margin-top:8px;cursor:pointer;text-align:left;
}
.btn:active{transform:scale(.98)}
.btn.main{background:var(--btn);border-color:var(--btn);color:#f7f1e4;text-align:center}
.btn.warn{border-color:color-mix(in srgb,var(--bad) 45%, var(--rule))}
.btn small{display:block;font-weight:400;font-size:12px;color:var(--faint);margin-top:2px}
.btn.main small{color:#e4ece6;opacity:.9}
.btn:disabled{opacity:.4;cursor:default}

@keyframes rise{ from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes fadein{ from{opacity:0} to{opacity:1} }

#app{display:none;flex-direction:column;max-width:560px;margin:0 auto;background:var(--paper);border-left:3px solid var(--margin);min-height:100vh;min-height:100dvh;height:100dvh;height:100svh;box-shadow:0 0 0 1px var(--rule);overflow:hidden}
#app.on{display:flex}
#board{
  position:sticky;top:0;z-index:20;
  background:
    radial-gradient(circle at 10px 16px, var(--paper) 3px, transparent 3.5px),
    radial-gradient(circle at 10px 36px, var(--paper) 3px, transparent 3.5px),
    var(--paper2);
  border-bottom:2px double var(--rule);
  box-shadow:inset 3px 0 0 var(--margin);
  padding:10px 14px 10px 18px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
}
#bd-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#bd-who{min-width:0;flex:1}
#bd-name{font-family:var(--serif);font-weight:900;font-size:18px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
#bd-name small{font-family:var(--sans);font-weight:500;font-size:12px;color:var(--faint)}
#bd-who-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,.9fr);gap:10px;align-items:start}
#bd-status{border:1px solid var(--rule);border-radius:6px;background:var(--paper2);padding:6px 7px;min-height:44px}
#bd-status .status-lab{font-family:var(--serif);font-size:10px;color:var(--faint);letter-spacing:.12em;margin-bottom:4px}
#bd-status-list{display:flex;flex-wrap:wrap;gap:4px}
.status-tag{display:inline-block;border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:2px 7px;font-size:11px;color:var(--ink);cursor:pointer}
.status-tag.bad{border-color:var(--tag-bad-bd);color:var(--bad);background:var(--warn-bg)}
.status-tag.good{border-color:var(--tag-good-bd);color:var(--good);background:color-mix(in srgb,var(--good) 8%,var(--card))}
.status-tag.neutral{border-color:var(--rule);color:var(--band)}
.status-empty{font-size:10px;color:var(--faint)}
#bd-idtags{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:7px;padding-top:6px;border-top:1px dashed var(--rule)}
#bd-idtags::before{content:'身分';font-family:var(--serif);font-size:10px;color:var(--faint);letter-spacing:.12em;margin-right:2px}
#bd-menu{border:1px solid var(--ctrl-bd);background:var(--ctrl);color:var(--ink);border-radius:999px;width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
#bd-menu svg{display:block}
#bd-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.bd-cell{background:var(--card);border:1px dashed var(--rule);border-radius:2px;padding:5px 4px 4px;text-align:center;box-shadow:0 1px 0 var(--paper)}
.bd-cell b{display:block;font-family:var(--serif);font-size:16px;color:var(--band);line-height:1.2}
.bd-cell span{font-size:10px;color:var(--faint);letter-spacing:.12em}
.bd-cell b .bd-frac{font-family:var(--sans);font-weight:500;white-space:nowrap;margin-left:1px;letter-spacing:0;color:inherit}
.bd-cell b .bd-slash{font-size:11px;color:var(--rule);padding:0 1px;vertical-align:2px;letter-spacing:0}
.bd-cell b .bd-max{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;letter-spacing:0;vertical-align:1px}
#bd-students,#bd-family{margin-top:7px;font-size:12px;color:var(--faint);line-height:1.5}
.tag{display:inline-block;border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:0 7px;font-size:11px;color:var(--ink)}
.tag.bad{border-color:var(--tag-bad-bd);color:var(--bad);background:var(--warn-bg)}
.tag.good{border-color:var(--tag-good-bd);color:var(--good)}
.tag.ghost{opacity:.7}
.tag.stu{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px}
.tag.stu:hover{border-color:var(--band);color:var(--band)}
#modal-box.stu-box{max-width:380px}
.stu-card h3{font-family:var(--serif);font-size:18px;margin:0 0 6px}
.stu-card .stu-meta{font-size:13px;color:var(--faint);line-height:1.7}
.stu-card .stu-st{margin-top:10px;padding:8px 10px;border:1px dashed var(--rule);border-radius:6px;font-size:13px}
.stu-card .stu-st b{color:var(--band)}
.stu-card .btn{margin-top:12px}
#lifebar{margin-top:8px;height:8px;background:var(--life-track);border-radius:99px;position:relative;overflow:visible}
#lifebar i{display:block;height:100%;background:var(--band);width:0;border-radius:99px}
#lifebar .mk{position:absolute;top:-3px;width:2px;height:14px;background:var(--margin);opacity:.7}
#life-cap{position:relative;height:16px;font-size:10px;color:var(--faint);margin-top:5px}
#life-cap .life-mark{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap;letter-spacing:.04em}

#log{
  flex:1;min-height:0;padding:12px 14px 22px 26px;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:
    linear-gradient(90deg, transparent 17px, var(--margin) 17px, var(--margin) 19px, transparent 19px),
    repeating-linear-gradient(transparent 0 31px, var(--rule) 31px 32px),
    var(--paper);
}
.yr-block{margin-bottom:10px}
.yr-head{font-family:var(--serif);font-size:13px;color:var(--faint);letter-spacing:.08em;cursor:pointer;padding:4px 0 6px;border-bottom:1px solid var(--rule);margin-bottom:4px}
.yr-head:hover{color:var(--ink)}
.yr-block.collapsed .yr-body{display:none}
.yr-block.now .yr-head{color:var(--band);font-weight:700}
.card{
  background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--margin);
  border-radius:2px 8px 8px 2px;
  padding:11px 12px;margin-top:10px;animation:rise .28s ease;
  box-shadow:2px 3px 0 var(--rule);
}
.card h4{font-family:var(--serif);font-size:13px;letter-spacing:.12em;color:var(--faint);margin-bottom:4px}
.card.good h4{color:var(--good)} .card.bad h4{color:var(--bad)} .card.gold h4{color:var(--gold)}
.card p+p{margin-top:6px}
.up{color:var(--good);font-weight:700}.dn{color:var(--bad);font-weight:700}.hl{color:var(--gold);font-weight:700}
.statline{font-size:16px;font-weight:700;background:var(--paper2);border:1px dashed var(--rule);border-radius:6px;padding:9px 10px;margin-top:8px;letter-spacing:.02em}

#act-side{
  position:sticky;bottom:0;z-index:20;
  background:
    repeating-linear-gradient(transparent 0 31px, var(--rule) 31px 32px),
    var(--paper);
  border-top:4px solid var(--margin);
  box-shadow:0 -10px 24px var(--shadow);
  max-height:52vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:8px 10px max(16px, env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;min-height:0;
}
#act-fold{
  display:block;width:100%;border:1px dashed var(--rule);
  background:var(--paper2);color:var(--faint);
  font-family:var(--serif);font-size:12px;font-weight:700;
  letter-spacing:.18em;padding:8px 12px;cursor:pointer;text-align:center;flex:none;
  border-radius:2px;margin-bottom:8px;
}
body.desk #act-fold{display:none}
body.act-min #act-side{max-height:none;overflow:visible;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--paper2)}
body.act-min #act,body.act-min #act-bar,body.act-min #tools-mob{display:none}
#act-bar{display:none}
#act{
  flex:1;
  margin:0 2px 8px;
  padding:14px 14px 16px;
  background:var(--card);
  border:2px solid var(--ink);
  outline:1px dashed var(--rule);
  outline-offset:5px;
  border-radius:2px;
  box-shadow:0 8px 18px var(--shadow);
  position:relative;
}
#act::before,#act::after{
  content:"";position:absolute;width:10px;height:10px;border-color:var(--margin);pointer-events:none;
}
#act::before{top:6px;left:6px;border-top:2px solid;border-left:2px solid}
#act::after{bottom:6px;right:6px;border-bottom:2px solid;border-right:2px solid}
#tools-mob{
  display:flex;flex-wrap:wrap;gap:8px;margin:0 2px 6px;padding:10px 8px;
  border:2px dashed var(--band);border-radius:4px;background:var(--paper2);
}
body.desk #tools-desk{
  margin:10px 2px 4px;padding:12px 10px 10px;
  border:2px dashed var(--band);border-radius:4px;
  background:var(--paper2);
}
#act.in{animation:rise .22s ease}
#act .title{font-family:var(--serif);font-size:14px;letter-spacing:.14em;color:var(--ink);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
body.desk #act .title{font-size:15px}
#act .act-body{display:block;margin-top:8px;font-family:var(--serif);font-size:17px;font-weight:500;letter-spacing:.02em;line-height:1.8;color:var(--ink)}
body.desk #act .act-body{font-size:20px;line-height:1.75;margin-top:10px;margin-bottom:6px}
body.desk #act .btn{font-size:16px;padding:12px 12px;border-width:1.5px}
body.desk #act .act-result{font-size:16px;line-height:1.7;padding:12px 14px}
.alloc-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:4px}
.alloc-head .title{margin-bottom:0;flex:1}
#tools-mob:empty,
#tools-desk:empty,
body.desk #tools-desk:empty{display:none}
#tools-mob .btn{flex:1 1 calc(50% - 4px);width:auto;margin:0;padding:10px 8px;font-size:13px;text-align:center}
#tools-desk{display:none}
.btn.pio{background:var(--pio);border-color:var(--pio);color:#f7f1e4;text-align:center}
.btn.job{background:var(--job);border-color:var(--job);color:#f7f1e4;text-align:center}
.btn.findjob{
  background-color:var(--job);
  background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.1) 0 5px,transparent 5px 12px);
  border:1.5px solid var(--job);color:#f7f1e4;
  font-weight:700;letter-spacing:.08em;margin:10px 0 8px;
}
html[data-theme="ink"] .btn.findjob{
  background-color:var(--job);border-color:var(--job);color:#f7faf6;
}
html[data-theme="dark"] .btn.findjob{
  background-color:var(--job);
  background-image:repeating-linear-gradient(-45deg,rgba(215,221,232,.12) 0 5px,transparent 5px 12px);
  border-color:var(--band);color:var(--ink);
}
html[data-theme="parchment"] .btn.findjob{
  background-color:var(--gold);
  background-image:repeating-linear-gradient(-45deg,rgba(42,34,24,.12) 0 5px,transparent 5px 12px);
  border-color:var(--gold);color:#2a2218;
}
.alloc-actions{display:flex;gap:8px;align-items:stretch;margin-top:6px}
.alloc-actions-l{flex:6;display:flex;flex-direction:column;gap:6px;min-width:0}
.alloc-actions-r{flex:4;display:flex;flex-direction:column;gap:6px;min-width:0}
.alloc-actions .btn{margin:0;width:100%}
.alloc-actions-r:empty{display:none}
.alloc-sum{
  background:var(--card);border:1px dashed var(--rule);border-radius:8px;
  padding:8px 10px;margin:6px 0 8px;
}
.alloc-metrics{display:grid;grid-template-columns:auto minmax(max-content,1fr) minmax(max-content,1fr);gap:8px;margin-top:8px;align-items:stretch}
.alloc-metrics-label{display:flex;align-items:center;justify-content:center;padding:8px 4px;font-size:12px;line-height:1.5;color:var(--faint);letter-spacing:.08em;font-weight:700;white-space:nowrap}

.timebar{display:flex;width:100%;height:28px;overflow:hidden;border:1px solid var(--rule);border-radius:6px;background:var(--life-track);box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}

html[data-theme="light"]{--tp-used:var(--band);--tp-used-text:#fffdf8}

.alloc-soft{display:flex;flex-direction:column;gap:8px;margin-top:10px}

.btn.tool{

}

}

.btn.warn{background:var(--warn-bg);color:var(--bad);text-align:center}
.act-result{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.tprow{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:7px 8px;margin-top:6px}
.tprow .nm{flex:1;font-size:14px;font-weight:700}
.tprow .nm small{display:block;font-weight:400;font-size:11px;color:var(--faint)}
.tprow .pm{display:flex;align-items:center;gap:6px}
.tprow button.pmb{width:32px;height:32px;border-radius:8px;border:1px solid var(--ctrl-bd);background:var(--ctrl);color:var(--ink);font-size:18px;cursor:pointer}
.tprow .val{width:28px;text-align:center;font-family:var(--serif);font-weight:700}
.tprow.lock{opacity:.65}
#tp-left{font-size:13px;margin:8px 0 4px;color:var(--band);font-weight:700}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.seg button{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:8px 2px;font-size:13px;font-weight:700;color:var(--faint);cursor:pointer}
.seg button.on{border-color:var(--band);color:var(--band);background:var(--seg-on)}
.focus-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 10px}
.focus-pick{
  text-align:left;background:var(--card);border:1px solid var(--rule);border-radius:8px;
  padding:10px 10px 8px;cursor:pointer;color:var(--ink);
}
.focus-pick.on{border-color:var(--band);background:var(--seg-on)}
.focus-pick b{display:block;font-family:var(--serif);font-size:15px;margin-bottom:2px}
.focus-pick small{display:block;font-size:11px;color:var(--faint);font-weight:400;line-height:1.45}
.life-sum{background:var(--card);border:1px dashed var(--rule);border-radius:8px;padding:10px 12px;margin:8px 0}
.life-sum .kicker{font-size:11px;letter-spacing:.16em;color:var(--faint);margin-bottom:4px}
.life-sum h3{font-family:var(--serif);font-size:20px;margin:0 0 6px}
.life-bands{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
.life-bands span{color:var(--faint)}
.life-bands b{font-family:var(--serif);text-align:right;font-variant-numeric:tabular-nums}

.life-foot{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--rule);font-size:13px}

.life-foot .used{color:var(--ink);text-align:right;margin:0;padding:0;border:0}
.life-foot .used strong{font-family:var(--serif)}
.tp-adj-list{display:flex;flex-direction:column;gap:10px;margin:8px 0 12px}
.tp-adj-row{
  display:grid;grid-template-columns:minmax(0,1fr) auto;
  align-items:center;gap:8px 10px;
}
.tp-adj-row .nm{font-size:14px;color:var(--ink);min-width:0;line-height:1.3}
.tp-step{display:flex;flex-wrap:nowrap;align-items:center;gap:6px;justify-self:end}
.tp-step .btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:36px;min-width:36px;max-width:36px;height:36px;
  padding:0;margin:0;flex:0 0 36px;text-align:center;line-height:1;
}
.tp-step .num{min-width:1.6em;text-align:center;font-family:var(--serif);font-size:18px;flex:none}
.tp-step .lab{min-width:3.2em;font-size:12px;text-align:right;flex:none}
.tp-step .lab.low{color:var(--bad)}
.tp-step .lab.high{color:var(--good)}
.life-note{font-size:12px;color:var(--faint);margin:8px 0 0;line-height:1.5}
.choice-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.choice-row .btn{margin-top:0;flex:1;text-align:center;padding:10px 8px}
.choice-row.wrap .btn{flex:1 1 42%}

#modal{position:fixed;inset:0;z-index:60;background:rgba(40,34,24,.45);display:none;align-items:center;justify-content:center;padding:22px}
#modal.show{display:flex}
#modal-box{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:16px;max-width:340px;width:100%;max-height:min(80vh,640px);overflow-y:auto;-webkit-overflow-scrolling:touch}
#modal-box.stu-box{max-width:380px}
#ending{display:none}
#app.leaving{animation:end-out .45s ease forwards;pointer-events:none}
#ending.enter{display:block;animation:end-in .55s ease}
html.ending-open, body.ending-open{
  height:100%;
  height:100dvh;
  overflow:hidden;
  overscroll-behavior-y:auto;
}
#ending.enter{
  display:block;
  position:fixed;
  inset:0;
  z-index:40;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:auto;
  scrollbar-width:none;
}
#ending.enter::-webkit-scrollbar{width:0;height:0;display:none}
#ending.sheet{

  background-attachment:local;
}
html[data-theme="dark"] #ending.sheet,
html[data-theme="parchment"] #ending.sheet{
  background-image:repeating-linear-gradient(transparent 0 31px, rgba(255,255,255,.05) 31px 32px);
}
#ending .brand{
  margin:4px 0 8px;padding-bottom:10px;border-bottom:1px solid var(--rule);
}
#ending .brand-mark{font-size:34px}
#ending .end-kind{
  font-family:var(--serif);font-weight:var(--title-weight);

}
#ending.tone-bad .end-kind{color:var(--bad)}
#ending.tone-gold .end-kind{color:var(--gold)}
#ending .end-lead{margin:4px 0 18px}
#ending .end-lead p{font-size:18px;line-height:32px}
.end-sec{margin:20px 0 6px}
.end-time{
  display:flex;justify-content:center;align-items:center;
  background:var(--card);border:1px dashed var(--rule);border-radius:2px;
  padding:8px 6px;box-shadow:0 1px 0 var(--paper);overflow:hidden;
}
.end-pie-wrap{width:100%;max-width:560px;margin:0 auto;}
.end-pie-svg{display:block;width:100%;height:auto;max-height:360px;margin:0 auto;overflow:visible;}
.end-pie-label-name{font-family:var(--serif);font-size:13px;font-weight:700;fill:var(--ink);}
.end-pie-label-pct{font-family:var(--serif);font-size:12px;font-weight:700;fill:var(--faint);}
.end-pie-label path{opacity:.9;}
@media(max-width:520px){
  .end-time{padding:4px 0;}
  .end-pie-label-name{font-size:11px;}
  .end-pie-label-pct{font-size:10px;}
}
.end-sec-lab{
  font-family:var(--serif);font-size:12px;letter-spacing:.22em;
  color:var(--faint);margin-bottom:10px;
}
.end-trait{
  background:var(--card);border:1px solid var(--rule);
  border-left:3px solid var(--gold);border-radius:2px 8px 8px 2px;
  padding:16px 16px 14px;margin:8px 0 8px;box-shadow:2px 3px 0 var(--rule);
}
.end-trait.love{border-left-color:var(--good)}
.end-trait.faith{border-left-color:var(--band)}
.end-trait h2{
  font-family:var(--serif);font-weight:var(--title-weight);
  font-size:22px;letter-spacing:.1em;margin:0 0 8px;color:var(--gold);line-height:1.35;
}
.end-trait.love h2{color:var(--good)}
.end-trait.faith h2{color:var(--band)}
.end-trait p{margin:0;font-size:17px;line-height:1.8;color:var(--ink)}
.end-who{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 6px;
}
.end-who > div{
  background:var(--card);border:1px dashed var(--rule);border-radius:2px;padding:10px 12px;
}
.end-who span{
  display:block;font-size:11px;letter-spacing:.16em;color:var(--faint);margin-bottom:4px;
}
.end-who b{font-family:var(--serif);font-size:18px;color:var(--ink);word-break:break-all;font-weight:700}
.end-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.end-cell{
  background:var(--card);border:1px dashed var(--rule);border-radius:2px;
  padding:10px 6px 8px;text-align:center;box-shadow:0 1px 0 var(--paper);
}
.end-cell b{
  display:block;font-family:var(--serif);font-size:24px;color:var(--band);
  line-height:1.2;font-variant-numeric:tabular-nums;font-weight:700;
}
.end-cell.hi b{color:var(--good)}
.end-cell.lo b{color:var(--bad)}
.end-cell.gold b{color:var(--gold)}
.end-cell span{display:block;margin-top:4px;font-size:11px;color:var(--faint);letter-spacing:.1em}
.end-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.end-tags{display:flex;flex-wrap:wrap;gap:6px}
.end-family,.end-students{font-size:16px;line-height:1.75;color:var(--ink)}
.end-students em{font-style:normal;color:var(--gold);font-weight:700}
.end-students button.linkish,.end-more{
  display:inline;background:none;border:none;padding:0;margin:0;
  color:var(--band);font-weight:700;font-size:15px;cursor:pointer;
  text-decoration:underline;text-underline-offset:3px;
}
.end-helped-list{list-style:none;margin:8px 0 0;padding:0}
.end-helped-list li{padding:8px 0;border-bottom:1px dashed var(--rule);font-size:14px;line-height:1.55}
.end-helped-list b{font-family:var(--serif)}
.end-helped-list span{color:var(--faint);display:block}
.end-empty{color:var(--faint);font-size:15px}
.end-span{margin:4px 0 2px;position:relative}
.end-span-track{
  height:8px;background:var(--life-track);border-radius:99px;position:relative;overflow:hidden;
}
.end-span-track i{display:block;height:100%;background:var(--band);border-radius:99px;width:0}
.end-span .mk{
  position:absolute;top:0;width:2px;height:8px;background:var(--margin);opacity:.7;pointer-events:none;
}
.end-span-lab{
  display:flex;justify-content:space-between;font-size:11px;
  letter-spacing:.12em;color:var(--faint);margin-top:5px;
}
.end-tl{
  list-style:none;margin:4px 0 0;padding:8px 0 10px 4px;position:relative;
}
.end-tl::before{
  content:"";position:absolute;left:15px;top:12px;bottom:10px;width:2px;
  background:var(--margin);opacity:.55;border-radius:2px;
}
.end-tl::after{
  content:"";position:absolute;left:11px;bottom:2px;width:10px;height:10px;
  box-sizing:border-box;border:2px solid var(--margin);background:var(--paper);
  transform:rotate(45deg);opacity:.8;
}
.end-item{position:relative;padding:0 0 18px 32px;min-height:38px}
.end-item:last-child{padding-bottom:12px}
.end-item::before{
  content:"";position:absolute;left:10px;top:7px;width:12px;height:12px;
  box-sizing:border-box;border-radius:50%;
  background:color-mix(in srgb, var(--margin) 28%, var(--paper));
  border:2px solid var(--margin);z-index:1;box-shadow:0 0 0 4px var(--paper);
}
.end-item .when{
  display:block;font-family:var(--serif);font-size:12px;
  letter-spacing:.14em;color:var(--faint);margin-bottom:3px;
}
.end-item .what{display:block;font-size:16px;line-height:1.6;color:var(--ink)}
.end-item.last::before{background:var(--gold);border-color:var(--gold)}
.end-item.last .when{color:var(--gold)}
.end-item.last .what{color:var(--gold);font-weight:700}
.end-item.bad::before{border-color:var(--bad)}
.end-item.bad.last::before{background:var(--bad);border-color:var(--bad)}
.end-item.bad.last .when,.end-item.bad.last .what{color:var(--bad)}
.end-actions{margin-top:28px;padding-top:16px;border-top:1px solid var(--rule)}
@media(max-width:420px){
  #ending .end-kind{font-size:26px}
  .end-grid{grid-template-columns:repeat(2,1fr)}
  .end-who{grid-template-columns:1fr}
  .end-cell b{font-size:22px}
  .end-trait h2{font-size:20px}
  .end-trait p{font-size:16px}
}
@keyframes end-out{to{opacity:0;transform:translateY(10px)}}
@keyframes end-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(min-width:900px){
  body{padding:18px 0}
  #app,.sheet{border-radius:4px;min-height:calc(100vh - 36px)}
}
/* 電腦版：左上狀態＋左下日記對齊；右側操作欄拉到畫面頂端。 */
body.desk #app.on{
  display:grid;
  grid-template-rows:auto minmax(0,1fr);
  grid-template-columns:minmax(0,1fr) 430px;
  max-width:1180px;
  height:calc(100vh - 36px);
  height:calc(100dvh - 36px);
  min-height:0;
}
body.desk #board{
  grid-column:1;
  grid-row:1;
  position:relative;height:auto;max-height:none;
  overflow-y:auto;border-bottom:2px double var(--rule);border-right:1px solid var(--rule);
  padding:12px 18px 10px 22px;
}
body.desk #bd-grid{grid-template-columns:repeat(3,minmax(70px,160px))}
body.desk #log{
  grid-column:1;
  grid-row:2;
  padding:14px 22px 24px 30px;
  border-right:1px solid var(--rule);
}
#dev-side{display:none}
body.desk #dev-side{
  display:none;grid-column:2;grid-row:1 / -1;
  background:var(--paper2);border-left:1px dashed var(--rule);
  padding:10px 12px 12px;overflow:auto;min-height:0;
  font-size:12px;line-height:1.55;color:var(--ink);
}

  grid-template-columns:minmax(0,1fr) 250px 430px;
}

.dev-kicker{font-family:var(--serif);font-size:11px;letter-spacing:.16em;color:var(--faint);margin-bottom:6px}
.dev-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin:6px 0 10px}
.dev-row{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--rule);padding:2px 0}
.dev-row b{font-family:var(--serif);font-weight:700}
.dev-sec{margin-top:8px;padding-top:6px;border-top:1px solid var(--rule)}
.dev-log{margin:4px 0 0;padding-left:16px}
.dev-log li{margin:2px 0}
body.desk #act-side{
  grid-column:2;
  grid-row:1 / -1;
  position:static;max-height:none;height:auto;
  overflow:auto;border-top:none;
  border-left:4px solid var(--margin);
  box-shadow:-10px 0 28px var(--shadow);
  display:flex;flex-direction:column;
  justify-content:flex-start;
  padding:16px 16px 18px 18px;
  background:
    repeating-linear-gradient(transparent 0 31px, var(--rule) 31px 32px),

}
body.desk #act-side::before{
  content:"這一頁";
  display:block;
  font-family:var(--serif);
  font-size:11px;
  letter-spacing:.28em;
  color:var(--faint);
  margin:0 6px 10px;
}
body.desk.dev #act-side{
  grid-column:3;
  grid-row:1 / -1;
  justify-content:flex-start;
}
body.desk #act{flex:0 1 auto;margin-top:auto}
body.desk.dev #act{flex:1}
body.desk #tools-mob{display:none}
body.desk #tools-desk{display:flex;flex-direction:column;gap:10px;margin-top:22px}

}

  background:var(--rule);
  border-radius:99px;
  border:1px solid var(--paper);
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

<!-- 開場：理念、種子、讀檔 -->
<div id="start" class="sheet">

    <p>從十九歲開始，每年你有 52 點時間（大約一週一點）。</p>
    <p>信仰、功課、工作、身體，不能樣樣都顧。</p>
    <p>寫在這本日記裡的，就是你走過的路。</p>
    <p>主線是耶和華見證人的信仰進程。</p>
    <p>你也可以過一般人的生活。</p>
  </div>
  <div class="field"><label>版面</label>
    <div class="choice-row" id="start-desk">
      <button type="button" class="btn" data-desk="0">手機版</button>

      <button type="button" class="btn" data-theme="ink">窗邊信紙</button>
      <button type="button" class="btn" data-theme="parchment">燈下羊皮</button>
    </div>
  </div>
  <button class="btn main" id="btn-new">翻開空白的一頁 ▸</button>
  <button class="btn" id="btn-load" style="display:none">繼續上次的日記</button>
  <div class="seedbar">
    <div class="seed-lab">世界種子</div>

/* 種子只是「洗牌的起點」。相同種子 + 相同按鈕順序 = 同一人生。 */
let SEED = '';
let _s = 0;
function seedInit(str){
  _s = 1779033703;
  for (let i = 0; i < str.length; i++){
    _s = Math.imul(_s ^ str.charCodeAt(i), 3432918353);
    _s = _s << 13 | _s >>> 19;
  }
}
function R(){
  /* 回傳 0～1 的小數。每一次呼叫都會往後走一格，所以呼叫次數不能亂改。 */
  _s |= 0;
  _s = _s + 0x6D2B79F5 | 0;
  let t = Math.imul(_s ^ _s >>> 15, 1 | _s);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
const ri = (a, b) => a + Math.floor(R() * (b - a + 1)); /* 含兩端的整數 */
const pick = a => a[Math.floor(R() * a.length)];
const chance = p => R() * 100 < p; /* p 是百分比，例如 chance(30) = 30% */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function nInt(mean, sd, min, max){
  /* 常態分布取整數，再夾在 min～max。開局隱藏數值用這個。 */
  const u = R() || 0.0001, v = R();
  const z = Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  return clamp(Math.round(mean + z * sd), min, max);
}

function fmtMoney(n){
  const sign = n < 0 ? '−' : '';
  const v = Math.abs(Math.round(n));
  const wan = Math.floor(v / 10000);
  const qian = Math.round((v % 10000) / 1000);
  if (wan && qian) return sign + wan + '萬' + qian + '千元';
  if (wan) return sign + wan + '萬元';
  if (qian) return sign + qian + '千元';
  return sign + v + '元';
}
function fmtBoardMoney(n){
  const sign = n < 0 ? '−' : '';
  const v = Math.abs(Math.round(n));
  if (v < 10000) return sign + v + '元';
  const wan = Math.round(v / 1000) / 10;
  return sign + String(wan).replace(/\.0$/, '') + '萬';
}

function rollChildhood(){
  const gender = chance(50) ? '男' : '女';
  const mood = chance(50) ? '和諧' : '緊張';
  const rW = R() * 100;
  const wealth = rW < 5 ? '富裕' : rW < 75 ? '普通' : '貧窮';
  const parentJW = chance(50);
  let parent = '傳統信仰', parentKind = '傳統';
  if (parentJW){
    parentKind = chance(50) ? '見證人1' : '見證人2';
    parent = '見證人';
  }

  let wit = nInt(100, 10, 80, 120);
  let love = nInt(15, 2.5, 10, 20);
  let faith = nInt(15, 2.5, 10, 20);
  let bible = 0;
  let health = chance(3) ? 20 : nInt(75, 2.5, 70, 80);
  let skill;
  if (wit <= 89) skill = ri(22, 28);
  else if (wit <= 99) skill = ri(32, 38);
  else if (wit <= 109) skill = ri(40, 46);
  else skill = ri(48, 56);

  const lines = [];
  lines.push(gender === '男' ? '你是個男生。' : '你是個女生。');
  if (wealth === '富裕'){
    faith += 8; skill += 10; health += 5;
    lines.push('出生在一個富裕的家庭。');
  } else if (wealth === '貧窮'){
    faith -= 4; skill -= 6; health -= 5;
    lines.push('出生在一個貧窮的家庭。');
  } else {
    lines.push('出生在一個普通的家庭。');
  }
  if (mood === '和諧'){
    const a = ri(8, 15), h = ri(5, 10);
    love += a; health += h;
    lines.push('從小家裡氣氛和諧，父母情緒穩定。');
  } else {
    const a = ri(5, 10), h = ri(5, 10);
    love -= a; health -= h;
    lines.push('從小家裡氣氛常常緊繃，家人常常吵架。');
  }
  let preBaptized = false;
  if (parentKind === '見證人1'){
    faith += (mood === '和諧' ? 24 : 16);
    bible += (mood === '和諧' ? 34 : 26);
    lines.push('從你有記憶以來，你就在會眾中長大，跟弟兄姐妹在一起，他們都像你的家人一樣。');
    preBaptized = chance(35);
    if (preBaptized){
      faith = Math.max(faith, 32);
      bible = Math.max(bible, 32);
      lines.push('你在年輕時就已經決定獻身受浸。');
    }
  } else if (parentKind === '見證人2'){
    faith += 12; bible += 16;
    lines.push('幾年前，你的父母開始學習聖經，也帶著你開始參加聚會，一段時間後，他們都受浸了，你在思考著自己是不是也該這樣做。');
  } else {
    bible += ri(5, 10);
    lines.push('你們家一直以來都信奉傳統信仰，雖然你不太喜歡那些習俗，但那早已是你生活理所當然的一部份了。');
  }
  if (wit > 110) lines.push('你自幼天賦聰穎。');

  love = clamp(love, 0, 100);
  faith = clamp(faith, 0, 100);
  bible = clamp(bible, 0, 100);
  skill = clamp(skill, 0, 100);
  health = clamp(health, 1, 90);

  return {
    gender, mood, wealth, parent, parentKind, wit, love, faith, bible, skill, health,
    preBaptized,
    story: lines.join(''),
    lines
  };
}

function worshipIntensity52(w){

  if (isDating()) return false;

  const pioneerOk = (has('正規先驅') && tagYears('正規先驅') >= 1.5)

function rollUniqueStudentName(g){
  const used = usedStudentNames();

  while (used.indexOf(name) >= 0 && n < 80){
    name = rollPersonName(g);

function rollStudentAge(){
  /* 18～80，30～59 較多（約六成） */
  const r = R();
  if (r < 0.18) return ri(18, 29);
  if (r < 0.78) return ri(30, 59);
  return ri(60, 80);
}
function rollStudentMarried(age){
  if (age <= 22) return chance(12);
  if (age <= 29) return chance(42);
  if (age <= 45) return chance(72);
  return chance(68);
}
function rollStudentChildren(age, married){
  if (!married) return 0;
  if (age < 24) return chance(25) ? 1 : 0;
  if (age < 35) return ri(0, 2);
  if (age < 50) return ri(0, 3);
  return Math.min(4, ri(0, 3) + (chance(20) ? 1 : 0));
}
function rollStudentJob(age, gender, married, children){
  if (age >= 63 && chance(70)) return '退休';
  if (age <= 24 && chance(55)) return '學生';
  if (married && children && chance(22)) return gender === '女' ? '家庭主婦' : '家庭主夫';
  if (age >= 60) return pick(STUDENT_JOBS_OLD);
  if (age <= 26) return pick(STUDENT_JOBS_YOUNG);

}
function rollStudentTraits(){
  const pool = STUDENT_TRAITS.slice();
  const a = pick(pool);
  const out = [a];
  if (chance(70)){
    const rest = pool.filter(t => t !== a);
    out.push(pick(rest));
  }
  return out;
}

    id: 'bs' + (++S._stuSeq),
    name: rollUniqueStudentName(g),
    gender: g,
    ageAtMeet: age,

function pickStudentPlot(){
  const plot = {};
  Object.keys(PLOT_BEATS).forEach(k => {
    const pool = PLOT_BEATS[k];
    plot[k] = pool[ri(0, pool.length - 1)].id;
  });
  return plot;
}
function plotBeatOf(st, stage){
  const pool = PLOT_BEATS[stage] || [];
  if (!st) return pool[0];
  st.plot = st.plot || pickStudentPlot();
  const id = st.plot[stage] || st.plot[String(stage)];
  return pool.find(b => b.id === id) || pool[ri(0, pool.length - 1)] || pool[0];
}
function materializePreach(ev){
  if (!ev || !ev.plotStage) return ev;
  const st = activeStudent() || S._pendingStudent;
  const beat = plotBeatOf(st, ev.plotStage);
  if (!beat) return ev;
  const next = ev.plotNext || null;
  const extraOk = ev.plotExtra || null;
  const ap = ev.plotStage === 1 ? PREACH_VISIT_A_OK : (ev.plotStage === 5 ? 50 : 55);
  const bp = ev.plotStage === 1 ? PREACH_VISIT_B_OK : (ev.plotStage === 5 ? 40 : 70);
  return {
    id: ev.id, name: beat.n, tags: ev.tags, stage: ev.stage, plotStage: ev.plotStage,
    text: beat.t, when: ev.when,
    options:[
      {id:'A', text: beat.a, results:[
        r('A1', ap, beat.aok, ev.plotStage === 5 ? {faith:4, bible:1, love:1} : {faith:2, bible:1}, extraOk, next),
        r('A2', 100 - ap, beat.ano, {faith:-1}, 'chainFail')
      ]},
      {id:'B', text: beat.b, results:[
        r('B1', bp, beat.bok, ev.plotStage === 5 ? {love:2, faith:2} : {love:2, faith:1}, extraOk, next),
        r('B2', 100 - bp, beat.bno, {love:-1}, 'chainFail')
      ]}
    ]
  };
}



function buildPreachChain(prefix, spec){
  return [{
    id: prefix, name: spec.name, tags:['傳道'], stage:'通用',
    weight: spec.weight || 5, cooldown:3, maxLife:5,
    text: spec.text,
    when: S => spec.when(S),
    onStart: S => { ensurePendingStudent(spec); },
    options:[
      {id:'A', text: spec.a || '邀請對方學習聖經', results:[
        r('A1', PREACH_START_OK, spec.ok || '對方願意再聊聊聖經。', {faith:1}, 'addStudent', 'PX-1'),
        r('A2', 100 - PREACH_START_OK, spec.no || '對方禮貌地結束了話題。', {faith:-1})
      ]},
      {id:'B', text: spec.b || '先當朋友，把話聽完', results:[
        r('B1', PREACH_START_OK, spec.ok2 || '談話很自然，對方留下聯絡方式。', {faith:1, love:1}, 'addStudent', 'PX-1'),
        r('B2', 100 - PREACH_START_OK, spec.no2 || '對方笑一笑就走開了。', {faith:-1})
      ]}
    ]
  }];
}

/* =========================================================
   07. 關係／家庭：認識、結婚、生育
   ========================================================= */
function startDating(person){
  const tr = person;
  S.partner = {
    name: tr.name,
    gender: tr.gender,
    jw: !!tr.jw,
    age: tr.age != null ? tr.age : Math.floor(S.age),
    jobKind: tr.jobKind || 'none',
    jobHigh: !!tr.jobHigh,
    pioneer: !!tr.pioneer,
    office: tr.office || null,
    actingCO: !!tr.actingCO,
    stage: 'love',
    since: S.turn,
    sinceAge: S.age,
  };
  S.everPartner = true;
  remTag('離婚'); remTag('喪偶');
  addTag('交往中', '開始與' + tr.name + '交往');
  board();
}
function doMarry(){
  if (!S.partner) return;
  S.partner.stage = 'married';
  S.partner.since = S.turn;
  S.partner.sinceAge = S.age;
  S.everMarried = true;
  // 結婚時將配偶的個人存款一次加入家庭存款。
  const spouseSavings = ri(10, 100) * 10000;
  S.partner.spouseSavings = spouseSavings;
  S.money += spouseSavings;
  if (S.gender === '女' && S.partner.gender === '男' && S.partner.jw && !S.partner.hsvc){
    S.partner.hsvc = { tags: {}, visits: 0 };
  }
  remTag('交往中'); remTag('離婚'); remTag('喪偶');
  addTag('已婚', '與' + S.partner.name + '結婚');
  S._askChildNow = true;
  S._lifeShock = true;
  if (playerIsJW() !== !!S.partner.jw) addTag('異信仰婚姻');
  else remTag('異信仰婚姻');
  const mode = S.lifeMode || 'normal';
  const cost = WEDDING_COST[mode] || WEDDING_COST.normal;
  S.money -= cost;
  board();
  return cost;
}
function doDivorce(reason){
  const name = S.partner ? S.partner.name : '';
  S.partner = null;
  remTag('已婚'); remTag('交往中'); remTag('異信仰婚姻');
  remTag('分區監督的妻子'); remTag('代理分區監督');
  if (S.service && S.service.kind === 'co' && S.gender === '女') S.service = null;
  addTag('離婚', '離婚');
  board();
  pendingDiary('info', '分開', (reason || '這段關係結束了。') + (name ? '（' + name + '）' : ''), nextStep);
}
function doWidow(reason){
  const name = S.partner ? S.partner.name : '';
  S.partner = null;
  remTag('已婚'); remTag('交往中'); remTag('異信仰婚姻');
  remTag('分區監督的妻子'); remTag('代理分區監督');
  if (S.service && S.service.kind === 'co' && S.gender === '女') S.service = null;
  addTag('喪偶', '喪偶');
  board();
  pendingDiary('bad', '喪偶', (reason || '配偶不在了。') + (name ? '（' + name + '）' : ''), nextStep);
}
function partnerJwChance(gender, worshipTp){
  const w = clamp(Math.floor(worshipTp || 0), 0, 18);
  const male = [0, 10, 25, 40, 50, 54, 58, 62, 66, 70, 74, 78, 82, 85, 88, 91, 94, 97, 100];
  const female = [0, 6, 15, 23, 30, 34, 38, 42, 46, 50, 54, 58, 62, 65, 68, 71, 74, 77, 80];
  return (gender === '男' ? male : female)[w];
}
function evMeetRoll(){
  ensureFamily();
  if (S.partner || S.age < 16){ nextStep(); return; }

  // 第一階段：先判定今年是否產生對象，固定 30%。
  if (!chance(30)){ nextStep(); return; }

  // 第二階段：已產生對象後，再依性別與上一年崇拜投入判定是否為見證人。
  const jwPct = partnerJwChance(S.gender, lastWorshipTp());
  const jw = chance(jwPct);
  const g = oppGender();
  const person = rollPartnerProfile(jw, g);
  const where = jw ? '在會眾裡' : (isStudent() ? '在學校' : '在工作場合');
  const info = partnerProfileText(person);

  // 產生對象後，50% 機率由玩家決定是否告白；50% 由對方告白。
  if (chance(50)){
    ask('遇到對象', where + '認識了' + person.name + '。<br>' + info + '<br>你有機會向對方表達心意。要告白嗎？', [
      {t:'向對方告白', f:() => {
        if (chance(50)){
          startDating(person);
          pendingDiary('gold', '戀愛', person.name + '答應了你的告白。你們開始交往。（' + info + '）', nextStep);
        } else {
          pendingDiary('info', '告白', person.name + '婉拒了你的告白，這段關係就此結束。（' + info + '）', nextStep);
        }
      }},
      {t:'先不告白', f:() => pendingDiary('info', '認識', '你決定先不向' + person.name + '告白，這段關係沒有繼續發展。', nextStep)}
    ]);
  } else {
    ask('遇到對象', where + '認識了' + person.name + '。<br>' + info + '<br>' + person.name + '主動向你告白了。', [
      {t:'接受，開始交往', f:() => {
        startDating(person);
        pendingDiary('gold', '戀愛', '你答應了' + person.name + '。你們開始交往。（' + info + '）', nextStep);
      }},
      {t:'拒絕', f:() => pendingDiary('info', '告白', '你拒絕了' + person.name + '的告白，這段關係就此結束。（' + info + '）', nextStep)}
    ]);
  }
}

function childAskChance(){
  const age = Math.floor(S.age);
  if (age >= 45) return 0;
  if (age <= 24) return 55;
  if (age <= 29) return 40;
  if (age <= 34) return 28;
  if (age <= 39) return 16;
  return 8;
}
function childPregnancyChance(){
  const age = Math.floor(S.age);
  if (age <= 24) return 90;
  if (age <= 29) return 85;
  if (age <= 34) return 75;
  if (age <= 39) return 60;
  if (age <= 44) return 35;
  return 10;
}
function evAskChild(){
  if (!S.partner || S.partner.stage !== 'married'){ nextStep(); return; }
  if (S.age < 19){ nextStep(); return; }
  if ((S.children || []).length >= 5){ nextStep(); return; }
  if (S.pregDue != null){ nextStep(); return; }
  if (S._childAskedTurn === S.turn){ nextStep(); return; }
  const forced = !!S._askChildNow;
  S._askChildNow = false;
  if (!forced && !chance(childAskChance())){ nextStep(); return; }
  S._childAskedTurn = S.turn;
  ask('生育', (forced ? '剛結婚。' : '年初。') + '要迎接一個孩子嗎？若答應，會先嘗試懷孕。', [
    {t:'要', f:() => {
      pendingDiary('info', '等待', '你們決定迎接孩子。稍等一下，看看是否成功懷孕。', () => {
        setTimeout(() => {
          if (chance(childPregnancyChance())){
            S.pregDue = Math.floor(S.age) + 1;
            askPregnancyServiceChange(() => pendingDiary('gold', '懷孕', '你們成功懷孕了，預計明年出生。', nextStep));
          } else {
            pendingDiary('info', '生育', '這次沒有成功懷孕。之後仍可以再次嘗試。', nextStep);
          }
        }, 700);
      });
    }},
    {t:'今年不要', f:() => nextStep()}
  ]);
}
function evRelYear(){
  const p = S.partner;
  if (!p || p.stage === 'married'){ nextStep(); return; }
  // 開始交往的當回合不立即詢問；從下一回合起，每年詢問一次。
  if (p.since === S.turn){ nextStep(); return; }
  const years = Math.max(1, Math.floor(datingYears()));
  const breakPct = Math.min(100, years <= 3 ? 10 : (years - 2) * 10);
  if (chance(breakPct)){
    const name = p.name;
    clearRelTags();
    S.partner = null;
    board();
    pendingDiary('info', '分手', name + '決定結束這段關係。', nextStep);
    return;
  }
  const name = p.name;
  ask('交往', '你們已經交往了' + years + '年，要結婚嗎？', [
    {t:'跟' + name + '結婚', f:() => {
      if (chance(80)){
        const cost = doMarry();
        pendingDiary('gold', '結婚', '你們登記結婚了。這次開銷 ' + fmtMoney(cost) + '；配偶帶來存款 ' + fmtMoney(S.partner.spouseSavings || 0) + '。', () => afterMarryService(() => evAskChild()));
      } else {
        pendingDiary('info', '結婚', name + '希望再等等，你們繼續交往。', nextStep);
      }
    }},
    {t:'再觀察一段時間', f:() => nextStep()}
  ]);
}
function endRomance(then){
  const p = S.partner;
  if (!p){ then(); return; }

function rollPartnerJob(age, specialEligible){
  const base = [
    { kind:'none', weight:12 },
    { kind:'part', weight:28 },
    { kind:'full', weight:50 },
  ];
  if (specialEligible && age >= 22){
    base.push(
      { kind:'tempSpecialPioneer', weight:4 },
      { kind:'specialPioneer', weight:2 },
      { kind:'tempLdc', weight:1 },
      { kind:'ldc', weight:0.5 },
      { kind:'tempBethel', weight:1 },
      { kind:'bethel', weight:0.5 },
    );
    if (age >= 30) base.push({ kind:'co', weight:1 });
  }
  const total = base.reduce((sum, item) => sum + item.weight, 0);
  let r = R() * total;
  for (const item of base){
    r -= item.weight;
    if (r < 0){
      const high = item.kind === 'full' ? chance(30) : item.kind === 'part' ? chance(25) : false;
      return { kind:item.kind, high };
    }
  }
  return { kind:'none', high:false };
}

  if (specialEligible && age >= 22 && ['part','full','tempSpecialPioneer','specialPioneer'].includes(job.kind)){

}

/* 高數值遞減：先算完這一項要加多少，再依「目前數值」打折。 */
function diminish(cur, gain, kind){
  if (gain <= 0) return gain;
  if (cur >= 100) return 0;
  let m = 1;
  if (kind === 'skill'){
    /* 專業能力比其他隱藏數值更難堆高，避免人人晚年都滿 100。 */
    if (cur >= 80) m = 0.2;
    else if (cur >= 65) m = 0.4;
    else if (cur >= 50) m = 0.6;
    else if (cur >= 35) m = 0.8;
  } else {
    if (cur >= 81) m = 0.25;
    else if (cur >= 71) m = 0.5;
    else if (cur >= 61) m = 0.75;
    else if (cur >= 51) m = 0.9;
  }
  const out = gain * m;
  return Math.min(out, 100 - cur);
}
function witMul(){ return S.wit / 100; }

function addStat(key, raw, useWit){
  /* key: love / faith / bible / skill / health
     useWit 只給聖經知識、專業能力的「增加」用。 */
  if (!raw) return 0;
  let g = raw;
  if (useWit && g > 0) g = g * witMul();
  const map = { love:'love', faith:'faith', bible:'bible', skill:'skill' };
  let got = 0;
  if (key === 'health'){
    const before = S.health;
    S.health = clamp(S.health + g, 0, S.hpCap);
    got = S.health - before;
  } else if (key === 'money'){
    S.money += g;
    got = g;
  } else {
    const k = map[key];
    if (!k) return 0;
    if (g > 0) g = diminish(S[k], g, k);
    const before = S[k];
    S[k] = clamp(S[k] + g, 0, 100);
    got = S[k] - before;
  }
  if (got) noteDevDelta(key, got);
  return got;
}

function insightRoll(statKey, already){
  /* 高悟性靈感：悟性 110～120，且本回合這項增加量已 > 0，才擲一次。 */
  if (S.wit < 110 || S.wit > 120) return 0;
  if (already <= 0) return 0;
  if (S[statKey] >= 100) return 0;
  if (!chance(20)) return 0;
  const bonus = chance(50) ? 1 : 2;

function visibleItems(){ return TP_ITEMS.filter(it => it.show()); }

function allocUsed(alloc){

}
function bodyTime(alloc){

function bodyNeed52(){
  if (!S) return 24;
  let n = 24;
  if (S.health < 30) n = 28;
  else if (S.health < 50) n = 26;
  if (S.age >= 60) n += 1;
  return clamp(n, 24, 30);
}
function familyNeed52(){
  let toddlerCount = 0;
  let schoolCount = 0;
  (S.children || []).forEach(c => {
    const st = childStageOf(c);
    if (st === '幼兒') toddlerCount += 1;
    else if (st === '就學') schoolCount += 1;
  });

  /* 第一個孩子的時間需求最高，之後同階段每增加一名孩子，新增需求遞減。 */
  let n = 0;
  if (toddlerCount > 0) n += 8 + (toddlerCount - 1) * 2;
  if (schoolCount > 0) n += 4 + (schoolCount - 1) * 1;
  if (S.partner && S.partner.stage === 'married' && n === 0) n += 3;
  return Math.min(18, n);

function extraNeedOf(id){

  if (S.job && S.job.kind === 'part') req.jobP = 8 + extraNeedOf('jobP');
  if (S.phase === 'MIL' && S.milType === 'alt') req.milA = 18;

}

function bandClass(lab){

  if (lab === '較多') return 'high';

function bandLabel(id, v){

function toSettleScale(plan){
  /* v5：不再折成 15 點，計畫本身就是結算用的 52 點。 */
  return Object.assign({}, plan || {});
}
function shiftTime(fromId, toId, n){
  n = n || 1;
  const plan = S.tpPlan || defaultAlloc();
  const floor = 0;
  if (fromId && (plan[fromId] || 0) - n >= floor){
    plan[fromId] -= n;
    if (toId && plan[toId] != null) plan[toId] += n;
  }
  S.tpPlan = plan;
  S.pendTp = toSettleScale(plan);
  return plan;
}
function raiseRequired(id, n){
  S._extraNeed = S._extraNeed || {};
  S._extraNeed[id] = extraNeedOf(id) + n;
  const plan = S.tpPlan || defaultAlloc();
  const order = ['grow','study','fun','sport','worship','jobP','jobF','school'];
  let need = n;
  order.forEach(k => {
    if (need <= 0 || plan[k] == null) return;
    const take = Math.min(need, Math.max(0, (plan[k] || 0) - (k === 'jobF' ? 8 : 0)));
    if (take > 0){ plan[k] -= take; need -= take; }
  });
  plan[id] = (plan[id] || 0) + (n - need);
  S.tpPlan = plan;
  S.pendTp = toSettleScale(plan);
  return plan;
}
function adjustableIds(plan){

}
function itemFloor(id){
  if (id === 'milA' || id === 'milB') return (S.tpPlan && S.tpPlan[id]) || 0;
  return 0;
}
function itemCapOf(id){
  const it = TP_ITEMS.find(x => x.id === id);
  return it && it.cap != null ? it.cap : 20;

function bumpTp(id, dir){
  const plan = S.tpPlan || defaultAlloc();
  const cur = plan[id] || 0;
  if (dir > 0){
    if (allocUsed(plan) >= TP_YEAR) return plan;
    if (cur >= itemCapOf(id)) return plan;
    plan[id] = cur + 1;
  } else {
    if (cur <= itemFloor(id)) return plan;
    plan[id] = cur - 1;
  }
  S.tpPlan = plan;
  S.pendTp = toSettleScale(plan);
  return plan;
}

function fitAllocToCap(alloc){
  /* 超過 52 點時，先砍可調整的非生理項目；生理是剩餘時間，不參與分配。 */
  const locked = {};
  visibleItems().forEach(it => { if (it.lock()) locked[it.id] = true; });
  const floorOf = k => {
    if (k === 'sport' || k === 'fun') return 0;
    if (k === 'family') return Math.max(0, familyNeed52() - 2);
    if (k === 'milA' || k === 'milB') return alloc[k] || 0;
    return 0;
  };
  const cutOrder = ['grow','study','worship','jobF','jobP','school','family','fun','sport'];
  while (allocUsed(alloc) > TP_YEAR){
    let did = false;
    for (let i = 0; i < cutOrder.length; i++){
      const k = cutOrder[i];
      if (alloc[k] == null || locked[k]) continue;
      if (alloc[k] > floorOf(k)){ alloc[k]--; did = true; break; }
    }
    if (!did){
      for (const k of cutOrder){
        if (alloc[k] == null || locked[k]) continue;
        if (alloc[k] > 0){ alloc[k]--; did = true; break; }
      }
    }
    if (!did) break;
  }
  return alloc;
}

function defaultAlloc(){
  const alloc = {};
  visibleItems().forEach(it => { alloc[it.id] = it.def(); });
  return fitAllocToCap(alloc);
}
function carryAlloc(){
  const prev = S.lastAlloc || {};
  const alloc = {};
  visibleItems().forEach(it => {
    if (it.lock()) alloc[it.id] = it.def();
    else if (prev[it.id] != null) alloc[it.id] = Math.min(itemCapOf(it.id), prev[it.id]);
    else alloc[it.id] = it.def();
  });
  return fitAllocToCap(alloc);
}
function bodyHealthDelta52(got){
  const need = bodyNeed52();
  /* E：低於必要生理需求時，依缺口造成睡眠不足傷害。 */
  const below = need - (got || 0);
  if (below <= 0) return [1, 1];
  if (below <= 3) return [-1, -1];
  if (below <= 6) return [-2, -2];
  if (below <= 9) return [-4, -4];
  return [-6, -6];
}
function jobFullHealth52(t){
  if (t <= 16) return 0;
  if (t <= 18) return -1;
  if (t <= 20) return -2;
  if (t <= 24) return -4;
  return -6;
}
function sportHealth52(t){
  if (t <= 0) return 0;
  if (t <= 3) return 1;
  if (t <= 6) return 2;
  return 2;
}
function funHealth52(t){
  /* 1 點起 +1，再多也不再加，避免靠玩把健康堆滿。 */
  if (t <= 0) return 0;
  return 1;
}

function previewHealth(alloc){
  let lo = 0, hi = 0;
  const add = (a, b) => { lo += a; hi += b; };
  const bh = bodyHealthDelta52(bodyTime(alloc));
  add(bh[0], bh[1]);
  if (isStudent() && (alloc.school || 0) >= 18) add(-1, -1);
  if (isStudent() && (alloc.school || 0) >= 22) add(-1, -1);
  if (S.job && S.job.kind === 'full'){
    const v = jobFullHealth52(alloc.jobF || 0);
    add(v, v);
  }
  if (S.job && S.job.kind === 'part' && (alloc.jobP || 0) >= 13) add(-1, -1);
  if (alloc.milA) add(-1, -1);
  if (alloc.milB) add(-2, -2);
  const w = canWorship() ? (alloc.worship || 0) : 0;
  if (canWorship() && w >= 14) add(-1, -1);
  const pl = pioneerLoadHealth(alloc);
  if (pl) add(pl, pl);
  add(sportHealth52(alloc.sport || 0), sportHealth52(alloc.sport || 0));
  if ((alloc.study || 0) >= 6) add(-1, -1);
  if ((alloc.grow || 0) >= 6) add(-1, -1);
  add(funHealth52(alloc.fun || 0), funHealth52(alloc.fun || 0));
  if (showLifeModeUI() && S.lifeMode){
    const hm = { simple:[-3,-2], normal:[-1,0], comfort:[1,2], enjoy:[3,4] }[S.lifeMode];
    if (hm && !(hm[0] === 0 && hm[1] === 0)) add(hm[0], hm[1]);
  }
  const famNeed = familyNeed52();
  const famGot = alloc.family || 0;
  if (famNeed && famGot < famNeed) add(famNeed - famGot <= 2 ? -1 : -2, famNeed - famGot <= 2 ? -1 : -2);
  if (S.money <= -1000000) add(-3, -3);
  const afterLo = clamp(S.health + lo, 0, S.hpCap);
  const afterHi = clamp(S.health + hi, 0, S.hpCap);
  return { lo, hi, afterLo, afterHi };
}

function fmtSigned(n){
  const v = Math.round(n * 10) / 10;
  return (v > 0 ? '+' : '') + v;
}

function toneColor(n){
  if (n > 0) return 'var(--good)';
  if (n < 0) return 'var(--bad)';

}
function healthPreviewLine(alloc){
  const p = previewHealth(alloc);
  const mid = (p.lo + p.hi) / 2;
  let delta;
  if (Math.abs(p.lo - p.hi) < 0.05) delta = fmtSigned(p.lo);
  else delta = fmtSigned(Math.min(p.lo, p.hi)) + '～' + fmtSigned(Math.max(p.lo, p.hi));
  return { text: '這一回健康大約 ' + delta, n: mid };
}
function fullJobScale(t){
  t = t || 0;
  if (t <= 0) return 0;
  if (t >= 14) return 1;
  return t / 16;
}
function jobHoursForPay(tp, job){
  if (!job) return 0;
  return job.kind === 'full' ? (tp.jobF || 0) : (tp.jobP || 0);
}
function jobIncomePreview(tp){
  const job = yearPayJob();
  if (!S || !job || S.phase === 'MIL' || isServiceAssign()) return { inn:0, ot:0 };
  if (job.kind === 'full'){
    const mid = (job.high ? 900000 : 520000);
    const t = jobHoursForPay(tp, job);
    const base = Math.round(mid * fullJobScale(t));
    const ot = Math.max(0, t - JOB_OT_AFTER.full) * (job.high ? JOB_OT_PAY.fullHigh : JOB_OT_PAY.full);
    return { inn: base + ot, ot };
  }
  const t = Math.min(15, Math.max(0, jobHoursForPay(tp, job)));
  const mid = job.high ? 340000 : 170000;
  const per = mid / 8;
  return { inn: Math.round(per * t), ot: 0 };
}
function jobIncomeSettle(tp){
  const job = yearPayJob();
  if (!S || !job) return { base:0, ot:0 };
  if (job.kind === 'full'){
    const raw = (job.high ? ri(76, 104) : ri(44, 60)) * 10000;
    const t = jobHoursForPay(tp, job);
    const base = Math.round(raw * fullJobScale(t));
    const ot = Math.max(0, t - JOB_OT_AFTER.full) * (job.high ? JOB_OT_PAY.fullHigh : JOB_OT_PAY.full);
    return { base, ot };
  }
  const t = Math.min(15, Math.max(0, jobHoursForPay(tp, job)));
  const annualSalary = (job.high ? ri(24, 44) : ri(14, 20)) * 10000;
  const perTp = annualSalary / 8;
  const base = Math.round(perTp * t);
  return { base, ot: 0 };
}
function estimateYearMoney(alloc){
  const tp = alloc || {};
  let inn = 0, out = 0;
  if (isStudent()){
    let pocket = S.wealth === '富裕' ? 200000 : S.wealth === '貧窮' ? 30000 : 80000;
    if (has('大學生')) pocket = Math.round(pocket * 0.7);
    inn += pocket;
  }
  if (S.phase === 'MIL'){
    inn += S.milType === 'alt' ? 120000 : 80000;
  } else if (isServiceAssign()){
    const k = S.service && S.service.kind;
    inn += k === 'co' ? 180000 : (k === 'bethel' ? 70000 : 150000);
  } else if (S.job){
    inn += jobIncomePreview(tp).inn;
  }
  if (S.partner && S.partner.stage === 'married') inn += Math.round(spouseIncomeBaseMid(S.partner) * SPOUSE_INCOME_MUL);
  const fn = tp.fun || 0, sp = tp.sport || 0, gr = tp.grow || 0, w = tp.worship || 0;
  const spendIdx = (fn * 1) + (sp * 0.6) + (gr * 0.5) + (w * 0.3);
  const t = clamp(spendIdx / 18, 0, 1);
  if (isStudent()){
    const mode = LIFE_MODE.simple;
    out += Math.round((mode.lo + (mode.hi - mode.lo) * t) * 0.5 * 10000);
  } else if (S.phase === 'MIL'){
    const mode = LIFE_MODE.simple;
    out += Math.round((mode.lo + (mode.hi - mode.lo) * t) * 0.5 * 10000);
  } else if (showLifeModeUI() && S.lifeMode && LIFE_MODE[S.lifeMode]){
    const mode = LIFE_MODE[S.lifeMode];
    let live = Math.round((mode.lo + (mode.hi - mode.lo) * t) * 10000);
    if (S.partner && S.partner.stage === 'married') live = Math.round(live * MARRIED_LIVE_MUL);
    if (isServiceAssign() && S.service.kind === 'bethel') live = Math.round(live * 0.35);
    if (!S.job && !isServiceAssign()) live = Math.round(live * 0.7);
    out += live;
  }
  if (has('大學生')) out += (S.uniType === '國立' ? 6 : 12) * 10000;
  (S.children || []).forEach(c => { out += CHILD_YEAR_COST[childStageOf(c)] || 0; });
  return { inn, out, net: inn - out };
}
function spouseIncomeBaseMid(p){
  if (!p || !p.jobKind || p.jobKind === 'none') return 0;
  if (p.jobKind === 'co') return 180000;
  if (p.jobKind === 'bethel' || p.jobKind === 'tempBethel') return 70000;
  if (['tempSpecialPioneer','specialPioneer','tempLdc','ldc'].includes(p.jobKind)) return 150000;
  if (p.jobKind === 'full' && p.jobHigh) return 900000;
  if (p.jobKind === 'full') return 520000;
  if (p.jobKind === 'part' && p.jobHigh) return 340000;
  return 170000;
}

function applyDebtRestriction(plan){
  if (!plan || !S._debtForceNextYear) return plan;
  if (showLifeModeUI()) S.lifeMode = 'simple';
  if (S.job && S.job.kind === 'full') plan.jobF = itemCapOf('jobF');
  if (S.job && S.job.kind === 'part') plan.jobP = itemCapOf('jobP');

  /* 強制工作後若超過 52 點，只從其他可調整項目扣回。 */
  const cutOrder = ['grow','study','worship','school','family','fun','sport'];
  while (allocUsed(plan) > TP_YEAR){
    let did = false;
    for (const k of cutOrder){
      if (plan[k] == null || plan[k] <= 0) continue;
      plan[k]--;
      did = true;
      break;
    }
    if (!did) break;
  }
  S.tpPlan = plan;
  S.pendTp = toSettleScale(plan);
  return plan;
}

function husReady(){
  return S.gender === '女' && S.partner && S.partner.stage === 'married' && S.partner.jw && S.partner.gender === '男';

function husInit(){
  if (!husReady()) return null;

function husHas(tag){
  const h = husInit();

function husYears(tag){
  const h = husInit();

function pickSkeAssign(){
  /* 伯特利／LDC 暫不走主軸，SKE 後只接地區：臨特或回會眾先驅。 */
  const age = S.age;
  const pool = [];
  if (age < 42 && !has('臨時特別先驅') && !has('特別先驅')) {
    pool.push({k:'tsp', w:62, title:'臨時特別先驅', tag:'臨時特別先驅', years:3});
  }
  pool.push({k:'cong', w:38, title:'到更需要人力的會眾繼續做正規先驅', tag:null, years:0});
  const sum = pool.reduce((a,x)=>a+x.w,0);
  let r = R() * sum;
  for (const x of pool){
    r -= x.w;
    if (r <= 0) return x;
  }
  return pool[pool.length-1];
}

  const tp = S.tpPlan || {};
  const job = S.job;
  const fullTp = job && job.kind === 'full' ? (tp.jobF || 0) : 0;
  const working = !!(job && (job.kind === 'full' || job.kind === 'part'));

  if (!working){
    if (hasStatus('workStress')){
      clearStatus('workStress');
      S._fullOtStreak = 0;
    }
    nextStep();
    return;
  }

  if (job.kind === 'full' && fullTp > JOB_OT_AFTER.full){
    S._fullOtStreak = (S._fullOtStreak || 0) + 1;
  } else {
    S._fullOtStreak = 0;

  if (hasStatus('workStress')){
    if (chance(15)){
      clearStatus('workStress');
      pendingDiary('info', '工作壓力改善', '近期工作量減少，你的工作壓力獲得改善。', nextStep);

      if (S.health <= 0){ lastPageThenEnd('sick'); return; }
      nextStep();
    });

  let p = 0;
  if (job.kind === 'part') p = job.high ? 2 : 1;
  if (job.kind === 'full') p = job.high ? 3 : 2;

  pendingDiary(S.health <= 0 ? 'bad' : 'bad', '工作壓力', '長期工作的壓力開始影響你的健康。這項壓力會持續存在，直到停止工作或出現改善事件。健康 -3。', () => {

/* ---------- 抽卡 ---------- */
function eventEligible(ev){
  if (ev.stage === '學生' && !isStudent()) return false;
  if (ev.stage === '出社會' && S.phase !== 'WORK') return false;
  if (ev.stage === '服役' && S.phase !== 'MIL') return false;
  if (typeof ev.when === 'function' && !ev.when(S)) return false;
  if (ev.maxLife && (S.seen[ev.id] || 0) >= ev.maxLife) return false;
  if (ev.cooldown && S.cool[ev.id] && S.cool[ev.id] > 0) return false;
  return true;
}
function weightedPick(list){
  const sum = list.reduce((a, e) => a + (e.weight || 1), 0);
  let r = R() * sum;
  for (const e of list){
    r -= (e.weight || 1);
    if (r <= 0) return e;
  }
  return list[list.length - 1];
}
function drawRandom(n, done){
  /* 普通事件池不含傳道鏈（開頭卡與跟進關）。傳道鏈改由 runPreachYear 另外跑，不佔 3 張。 */
  const picked = [];
  let pool = EVENTS.filter(e => eventEligible(e) && !isPreachChainId(e.id));
  while (picked.length < n && pool.length){
    const ev = weightedPick(pool);
    picked.push(ev);
    pool = pool.filter(e => e.id !== ev.id);
  }
  runEventList(picked, done);
}
function runPreachYear(done){
  if (!isPublisher() || !canWorship()){ done(); return; }
  ensureBibleStudentsSafe();
  S.chainsNewThisYear = 0;
  const queue = [];
  rollStoppedResumes().forEach(st => queue.push({type:'resume', id: st.id}));
  activeStudents().filter(st => st.next)
    .sort((a,b) => (a.startedTurn||0) - (b.startedTurn||0))
    .slice(0, PREACH_FOLLOW_MAX_PER_YEAR)
    .forEach(st => queue.push({type:'follow', id: st.id}));
  const wtp = worshipIntensity52((S.tpPlan && S.tpPlan.worship) || (S.pendTp && S.pendTp.worship) || 0);
  const cap = preachChainCap();
  const slots = Math.max(0, cap - activeStudents().length);
  const nOpp = Math.min(newChainOpportunities(wtp, cap), slots);
  const p = newChainSuccessRate(wtp);
  for (let i = 0; i < nOpp; i++) queue.push({type:'newroll', p: p});
  runPreachQueue(queue, done);
}
function ensureBibleStudentsSafe(){
  if (!S.bibleStudents) S.bibleStudents = [];
  if (!S.usedStudentNames) S.usedStudentNames = [];
  if (S._stuSeq == null) S._stuSeq = S.bibleStudents.length;
}
function stoppedStudents(){
  return allBibleStudents().filter(st => st && st.status === STUDENT_STATUS.stop && !st.handedOff && !st.noResume);

function leaveCongregation(){
  (S.bibleStudents || []).forEach(st => {
    st.noResume = true;
    st.next = null;
    st.resumeId = null;
    if (st.status !== STUDENT_STATUS.bap){
      st.alive = false;
      st.handedOff = true;
      st.status = STUDENT_STATUS.stop;
